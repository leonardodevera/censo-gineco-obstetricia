<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1f5fbf">
<title>Censo Gineco-Obstetricia</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f5f7fb;color:#172033}header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #dde3ec;padding:12px}.headrow{display:flex;align-items:center;gap:10px;margin-bottom:8px}h1{font-size:20px;margin:0;flex:1}.search{flex:0 1 390px}.search input{width:100%;border:1px solid #cbd5e1;border-radius:999px;padding:9px 13px;background:#f8fafc}.sum,.tabs,.demo,.actions,.labtools,.labtabs{display:flex;gap:8px;flex-wrap:wrap}.pill{background:#eef2f7;border:1px solid #d9e0ea;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:700}.pill.active{background:#1f5fbf;color:#fff}main{padding:12px;max-width:1200px;margin:auto}.tabs{overflow:auto}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.bed{min-height:122px;border:2px solid #a8b0ba;border-radius:12px;padding:10px;text-align:left;background:#edf1f5}.bed.preg{background:#fff3cd;border-color:#e6b800}.bed.puer{background:#ffe0ec;border-color:#d94f8a}.bed.gyn{background:#dceeff;border-color:#3986c6}.top{display:flex;justify-content:space-between;gap:6px}.id{font-weight:800}.badge{font-size:10px;background:#ffffffa8;padding:3px 6px;border-radius:999px}.name{font-weight:700;margin-top:8px;font-size:13px}.dx{font-size:11px;margin-top:4px;color:#475569}.task{font-size:11px;font-weight:800;margin-top:7px}.pending{color:#8a5a00}.overdue{color:#b42318}.specials{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}.specialtag{font-size:9px;font-weight:800;padding:3px 6px;border-radius:999px;background:#fff;border:1px solid #f59e0b;color:#92400e}button,input,select,textarea{font:inherit}button{border:1px solid #cfd7e3;background:white;border-radius:9px;padding:10px;cursor:pointer}.primary{background:#1f5fbf;color:#fff;border-color:#1f5fbf}.danger{color:#b42318;background:#fff3f3}.demo{margin-top:12px}#modal{display:none;position:fixed;inset:0;background:#0007;z-index:30;padding:10px;overflow:auto}.panel{background:#fff;border-radius:16px;max-width:760px;margin:10px auto}.head{display:flex;justify-content:space-between;align-items:center;padding:14px;border-bottom:1px solid #e2e8f0}.body{padding:14px}.form{display:grid;gap:10px}.form label{font-size:12px;font-weight:700}.form input,.form select,.form textarea{display:block;width:100%;margin-top:4px;border:1px solid #cbd5e1;border-radius:9px;padding:10px;font-size:16px}.form textarea{min-height:68px}.specialbox,.labbox{border:1px solid #dbe3ee;border-radius:10px;padding:10px;background:#f8fafc}.checks{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}.checks label{display:flex;align-items:center;gap:6px}.checks input{width:auto;margin:0}.labhint{font-size:11px;color:#64748b}.labtabs{margin-top:10px}.labtab{padding:7px 9px;font-size:12px}.labtab.active{background:#1f5fbf;color:#fff}.labview{margin-top:9px}.labgroup{margin-top:9px}.labtitle{font-size:11px;font-weight:800;text-transform:uppercase;color:#334155;margin-bottom:5px}.labchips{display:flex;gap:5px;flex-wrap:wrap}.labchip{font-size:12px;background:#fff;border:1px solid #dbe3ee;border-radius:8px;padding:6px 8px}.compare{overflow:auto}.compare table{border-collapse:collapse;width:100%;font-size:12px}.compare th,.compare td{border:1px solid #dbe3ee;padding:7px;text-align:left;white-space:nowrap}.taskrow{display:grid;grid-template-columns:1fr 145px 110px;gap:6px}.taskitem{display:flex;gap:8px;align-items:flex-start;background:#f8fafc;border:1px solid #e2e8f0;border-radius:9px;padding:9px;margin-top:7px;font-size:13px}.taskitem input{width:auto;margin-top:3px}.tasktext{flex:1}.state{display:inline-block;font-size:10px;font-weight:800;padding:3px 6px;border-radius:999px;margin-bottom:4px}.state.pending{background:#fff7d6}.state.overdue{background:#fee2e2;color:#991b1b}.state.done{background:#dcfce7;color:#166534}.noteBtn{margin-top:7px;padding:6px 8px;font-size:11px}.tasknote{margin-top:7px;padding:7px;background:#fff7ed;border:1px solid #fed7aa;border-radius:8px}.empty{text-align:center;padding:25px;color:#64748b}.actions{margin-top:12px}
@media(max-width:600px){h1{font-size:17px}.search{flex:0 0 48%;min-width:0}.taskrow{grid-template-columns:1fr 1fr}.taskrow #taskText{grid-column:1/-1}}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.form{grid-template-columns:1fr 1fr}.full{grid-column:1/-1}}
</style></head><body>
<header><div class="headrow"><h1>Censo Gineco-Obstetricia</h1><div class="search"><input id="search" type="search" placeholder="🔎 Buscar nombre, HC o cama"></div></div><div class="sum"><button class="pill" id="occ"></button><button class="pill" id="free"></button><button class="pill" id="pend"></button></div></header>
<main><div class="tabs"><button data-sector="preg">🤰 Embarazadas</button><button data-sector="puer">👶 Puérperas</button><button data-sector="flex">♀ Ginecológicas / Puérperas</button></div><div class="demo"><button class="primary" id="demo">Cargar demostración</button><button id="reset">Vaciar demo</button></div><div id="beds" class="grid"></div></main>
<div id="modal"><div class="panel"><div class="head"><strong id="title">Cama</strong><button id="close">✕</button></div><div class="body"><form id="form" class="form">
<label>Tipo<select id="type"><option value="">Disponible</option><option value="preg">Embarazada</option><option value="puer">Puérpera</option><option value="gyn">Ginecológica</option></select></label><label>Historia clínica<input id="hc"></label><label class="full">Nombre y apellidos<input id="name"></label>
<div class="full specialbox"><strong>⚠️ Condición especial</strong><div class="checks"><label><input type="checkbox" id="postICU"> Post-UCI</label><label><input type="checkbox" id="isolation"> Aislamiento</label><label><input type="checkbox" id="closeWatch"> Vigilancia estrecha</label></div></div>
<label class="full">Diagnósticos<textarea id="dx"></textarea></label><label class="full">Procedimiento<textarea id="proc"></textarea></label><label class="full">Kardex<textarea id="kardex"></textarea></label><label class="full">Plan<textarea id="plan"></textarea></label>
<div class="full labbox"><strong>🧪 Laboratorios</strong><textarea id="labs" placeholder="Pega aquí una nueva toma de laboratorio"></textarea><div class="labtools"><button type="button" class="primary" id="saveLab">Guardar nueva toma</button><button type="button" id="compareLabs">📊 Comparar</button><span class="labhint">Detecta fecha y hora; la hora es opcional.</span></div><div id="labTabs" class="labtabs"></div><div id="labView" class="labview"></div></div>
<div class="full"><strong>Pendientes / recordatorios</strong><div class="taskrow"><input id="taskText" placeholder="Ej. Ecografía obstétrica"><input id="taskDate" type="date"><input id="taskTime" type="time"></div><button type="button" id="addTask">Añadir pendiente</button><div id="taskList"></div></div>
<div class="full actions"><button class="primary" type="submit">Guardar cama</button><button class="danger" type="button" id="release">Liberar cama</button></div>
</form></div></div></div>
<script>
const BED_IDS=['601','602','603-A','603-B','604-A','604-B','604-C','604-D','605-A','605-B','605-C','605-D','606-A','606-B','607-A','607-B','608-A','608-B','608-C','608-D','609-A','609-B','609-C','609-D','6010-A','6010-B','6010-C','6010-D','6011-A','6011-B','612','613','614-A','614-B','615-A','615-B','615-C','615-D','616-A','616-B','616-C','616-D','617-A','617-B','618-A','618-B','619-A','619-B','620-A','620-B','620-C','620-D','621-A','621-B','621-C','621-D','622-A','622-B','622-C','622-D'];
const KEY='censo_go_v2_realbeds';let sector='preg',filter='sector',selected=null,beds,activeLab=0;
const emptySpecial=()=>({postICU:false,isolation:false,closeWatch:false});
const makeBeds=()=>BED_IDS.map((id,index)=>({id,index,type:'',name:'',hc:'',dx:'',proc:'',kardex:'',plan:'',labs:'',labEntries:[],special:emptySpecial(),tasks:[]}));
try{beds=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}if(!Array.isArray(beds)||beds.length!==60)beds=makeBeds();
beds=beds.map((b,i)=>({...makeBeds()[i],...b,id:BED_IDS[i],index:i,labEntries:Array.isArray(b.labEntries)?b.labEntries:[],special:{...emptySpecial(),...(b.special||{})},tasks:Array.isArray(b.tasks)?b.tasks.map(t=>({text:t.text||'',date:t.date||'',time:t.time||'',done:!!t.done,note:t.note||''})):[]}));
const $=id=>document.getElementById(id),ranges={preg:[0,19],puer:[20,39],flex:[40,59]},label={preg:'Embarazada',puer:'Puérpera',gyn:'Ginecológica','':'Disponible'},icon={preg:'🤰',puer:'👶',gyn:'♀','':'○'};
function save(){localStorage.setItem(KEY,JSON.stringify(beds))}function norm(s){return(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}function defaultType(i){return i<20?'preg':i<40?'puer':''}
function localDate(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function fmtDate(s){if(!s)return'';let p=s.split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:s}
function taskStatus(t){if(t.done)return'done';if(t.date&&t.time&&new Date()>new Date(t.date+'T'+t.time+':00'))return'overdue';return'pending'}
function specialTags(b){let a=[];if(b.special.postICU)a.push('POST-UCI');if(b.special.isolation)a.push('AISLAMIENTO');if(b.special.closeWatch)a.push('VIGILANCIA');return a.length?'<div class="specials">'+a.map(x=>'<span class="specialtag">⚠️ '+x+'</span>').join('')+'</div>':''}
function filteredBeds(){let q=norm($('search').value.trim());if(q)return beds.filter(b=>norm(b.name).includes(q)||norm(b.hc).includes(q)||norm(b.id).includes(q));if(filter==='occupied')return beds.filter(b=>b.type);if(filter==='free')return beds.filter(b=>!b.type);if(filter==='pending')return beds.filter(b=>b.tasks.some(t=>taskStatus(t)!=='done'));let r=ranges[sector];return beds.filter(b=>b.index>=r[0]&&b.index<=r[1])}
function render(){let box=$('beds');box.innerHTML='';let list=filteredBeds();if(!list.length)box.innerHTML='<div class="empty">No se encontraron camas.</div>';list.forEach(b=>{let t=b.type||defaultType(b.index),u=b.tasks.filter(x=>taskStatus(x)!=='done'),o=u.filter(x=>taskStatus(x)==='overdue').length,p=u.length-o,btn=document.createElement('button');btn.className='bed '+(b.type||t||'');btn.innerHTML='<div class="top"><span class="id">Cama '+b.id+'</span><span class="badge">'+icon[t]+' '+(b.type?label[b.type]:(b.index>=40?'Ginecológica / Puérpera':label[t]))+'</span></div><div class="name">'+(b.name||'Disponible')+'</div><div class="dx">'+(b.dx||'Toca para ingresar paciente')+'</div>'+specialTags(b)+(o?'<div class="task overdue">🔴 '+o+' vencido(s)</div>':'')+(p?'<div class="task pending">⏳ '+p+' pendiente(s)</div>':'');btn.onclick=()=>openBed(b.index);box.appendChild(btn)});let occ=beds.filter(b=>b.type).length,u=beds.flatMap(b=>b.tasks).filter(t=>taskStatus(t)!=='done'),o=u.filter(t=>taskStatus(t)==='overdue').length;$('occ').textContent=occ+' ocupadas';$('free').textContent=(60-occ)+' disponibles';$('pend').textContent=u.length+' pendientes'+(o?' · '+o+' vencidos':'')}
function parseLabMeta(raw){let m=raw.match(/(?:^|\n)\s*(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})(?:\s+(?:Hora\s*:?\s*)?(\d{1,2}):(\d{2}))?/i);if(!m)return{date:'',time:''};return{date:m[1]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[3]).padStart(2,'0'),time:m[4]?String(m[4]).padStart(2,'0')+':'+m[5]:''}}
function cleanLabLine(s){return s.replace(/\.+\s*:/,':').replace(/\s+/g,' ').trim()}
function labGroup(x){let n=norm(x);if(/hemoglob|\bhgb\b|\bhb\b|hematoc|\bhct\b|\bhto\b|leucoc|wbc|neutro|linfoc|monoc|eosin|basof|plaquet|plt|eritroc|rbc|vcm|hcm|chcm|rdw/.test(n))return'Hemograma';if(/glucos|urea|bun|creatin|acido uric|proteina total|albumin/.test(n))return'Química';if(/\btgo\b|\bast\b|\btgp\b|\balt\b|bilirr|fosfatasa|ggt|ldh/.test(n))return'Función hepática';if(/\btp\b|protrom|inr|ttp|aptt|fibrin|dimero/.test(n))return'Coagulación';if(/\bpcr\b|proteina c reactiva|procalciton|vsg/.test(n))return'Inflamación';if(/sodio|potasio|cloro|calcio|magnesio|fosforo/.test(n))return'Electrolitos';if(/orina|bacter|nitrito|esterasa|densidad|urobil|ceton/.test(n))return'Orina';return'Otros'}
function labLines(raw){return raw.replace(/\r/g,'\n').split(/\n+|\s+[|]\s+|\s*;\s*|\s+\/\s+/).map(cleanLabLine).filter(x=>x.length>1&&!/^\s*\d{4}[\/\-]\d{1,2}[\/\-]\d{1,2}(?:\s+Hora\s*:?\s*\d{1,2}:\d{2})?\s*$/i.test(x))}
function extractValues(raw){let out={};labLines(raw).forEach(line=>{let m=line.match(/^(.+?)(?:\.{2,}|:)\s*([-+]?\d+(?:[.,]\d+)?\s*%?)/);if(!m)return;let key=m[1].replace(/\([^)]*\)/g,'').trim(),val=m[2].trim();if(key&&!out[key])out[key]=val});return out}
function labLabel(e,i){return e.date?'🧪 '+fmtDate(e.date)+(e.time?' · '+e.time:''):'🧪 Sin fecha '+(i+1)}
function renderLabEntry(e){let box=$('labView'),groups={};labLines(e.raw).forEach(x=>(groups[labGroup(x)]||(groups[labGroup(x)]=[])).push(x));box.innerHTML='<div style="font-weight:800;margin-bottom:8px">'+labLabel(e,activeLab)+'</div>';['Hemograma','Química','Función hepática','Coagulación','Inflamación','Electrolitos','Orina','Otros'].forEach(g=>{if(!groups[g])return;box.innerHTML+='<div class="labgroup"><div class="labtitle">'+g+'</div><div class="labchips">'+groups[g].map(x=>'<div class="labchip">'+x.replace(/</g,'&lt;')+'</div>').join('')+'</div></div>'})}
function renderLabTabs(){let b=beds[selected],tabs=$('labTabs'),view=$('labView');tabs.innerHTML='';view.innerHTML='';if(!b.labEntries.length){view.innerHTML='<div class="labhint">Aún no hay tomas guardadas.</div>';return}b.labEntries.sort((a,c)=>(c.date+' '+(c.time||'')).localeCompare(a.date+' '+(a.time||'')));if(activeLab>=b.labEntries.length)activeLab=0;b.labEntries.forEach((e,i)=>{let bt=document.createElement('button');bt.type='button';bt.className='labtab '+(i===activeLab?'active':'');bt.textContent=labLabel(e,i);bt.onclick=()=>{activeLab=i;renderLabTabs()};tabs.appendChild(bt)});renderLabEntry(b.labEntries[activeLab])}
function compareLabs(){let es=beds[selected].labEntries;if(es.length<2){alert('Necesitas al menos dos tomas para comparar.');return}let keys=[];es.forEach(e=>Object.keys(extractValues(e.raw)).forEach(k=>{if(!keys.some(x=>norm(x)===norm(k)))keys.push(k)}));let html='<div class="compare"><table><thead><tr><th>Examen</th>'+es.map((e,i)=>'<th>'+labLabel(e,i).replace('🧪 ','')+'</th>').join('')+'</tr></thead><tbody>';keys.forEach(k=>{html+='<tr><th>'+k+'</th>'+es.map(e=>{let v=extractValues(e.raw),match=Object.keys(v).find(x=>norm(x)===norm(k));return'<td>'+(match?v[match]:'—')+'</td>'}).join('')+'</tr>'});$('labView').innerHTML=html+'</tbody></table></div>'}
function openBed(i){selected=i;activeLab=0;let b=beds[i];$('title').textContent='Cama '+b.id;['type','hc','name','dx','proc','kardex','plan'].forEach(k=>$(k).value=b[k]||'');$('labs').value='';$('postICU').checked=!!b.special.postICU;$('isolation').checked=!!b.special.isolation;$('closeWatch').checked=!!b.special.closeWatch;$('taskDate').value=localDate();renderLabTabs();renderTasks();$('modal').style.display='block'}
function sync(){if(selected===null)return;let b=beds[selected];['type','hc','name','dx','proc','kardex','plan'].forEach(k=>b[k]=$(k).value.trim());b.special={postICU:$('postICU').checked,isolation:$('isolation').checked,closeWatch:$('closeWatch').checked}}
function renderTasks(){let b=beds[selected],box=$('taskList');box.innerHTML='';if(!b.tasks.length){box.innerHTML='<div class="labhint">Sin pendientes.</div>';return}b.tasks.forEach(t=>{let st=taskStatus(t),row=document.createElement('div');row.className='taskitem';let cb=document.createElement('input');cb.type='checkbox';cb.checked=t.done;cb.disabled=st==='overdue';cb.onchange=()=>{t.done=cb.checked;save();renderTasks();render()};let tx=document.createElement('div');tx.className='tasktext';tx.innerHTML='<span class="state '+st+'">'+(st==='done'?'✅ REALIZADO':st==='overdue'?'🔴 VENCIDO':'⏳ PENDIENTE')+'</span><div>'+t.text+' · '+[fmtDate(t.date),t.time].filter(Boolean).join(' · ')+'</div>';if(st==='overdue'){if(t.note)tx.innerHTML+='<div class="tasknote">📝 '+t.note+'</div>';else{let bt=document.createElement('button');bt.type='button';bt.className='noteBtn';bt.textContent='📝 Agregar nota aclaratoria';bt.onclick=()=>{let n=prompt('Escribe la nota aclaratoria:');if(n&&n.trim()){t.note=n.trim();save();renderTasks()}};tx.appendChild(bt)}}row.append(cb,tx);box.appendChild(row)})}
$('saveLab').onclick=()=>{let raw=$('labs').value.trim();if(!raw||selected===null)return;sync();let m=parseLabMeta(raw);beds[selected].labEntries.push({date:m.date,time:m.time,raw});$('labs').value='';activeLab=0;save();renderLabTabs()};
$('compareLabs').onclick=compareLabs;
document.querySelectorAll('[data-sector]').forEach(b=>b.onclick=()=>{sector=b.dataset.sector;filter='sector';$('search').value='';render()});$('search').oninput=render;$('occ').onclick=()=>{filter=filter==='occupied'?'sector':'occupied';render()};$('free').onclick=()=>{filter=filter==='free'?'sector':'free';render()};$('pend').onclick=()=>{filter=filter==='pending'?'sector':'pending';render()};$('close').onclick=()=>$('modal').style.display='none';
$('form').onsubmit=e=>{e.preventDefault();sync();save();render();$('modal').style.display='none'};$('addTask').onclick=()=>{let text=$('taskText').value.trim();if(!text)return;sync();beds[selected].tasks.push({text,date:$('taskDate').value,time:$('taskTime').value,done:false,note:''});$('taskText').value='';$('taskTime').value='';save();renderTasks();render()};
$('release').onclick=()=>{if(selected===null||!confirm('¿Liberar cama y borrar los datos de esta paciente?'))return;let id=beds[selected].id;beds[selected]={...makeBeds()[selected],id};save();render();$('modal').style.display='none'};
$('demo').onclick=()=>{beds=makeBeds();let d1='2026/09/01 Hora: 20:39\nLeucocitos (WBC)...............: 9.22\nHemoglobina (HGB)..............: 11.6\nHematocrito (HCT)..............: 35.1\nPlaquetas......................: 253\nNeutrofilos %..................: 67.8',d2='2026/09/03 Hora: 08:15\nLeucocitos (WBC)...............: 8.90\nHemoglobina (HGB)..............: 11.1\nHematocrito (HCT)..............: 34.0\nPlaquetas......................: 230\nNeutrofilos %..................: 65.2';beds[0]={...beds[0],type:'preg',name:'María P. (demo)',hc:'001234',dx:'Amenaza de parto pretérmino',plan:'Vigilancia materno-fetal',labEntries:[{date:'2026-09-03',time:'08:15',raw:d2},{date:'2026-09-01',time:'20:39',raw:d1}],special:{postICU:false,isolation:false,closeWatch:true},tasks:[]};save();render()};
$('reset').onclick=()=>{if(confirm('¿Vaciar las 60 camas?')){beds=makeBeds();save();render()}};render();setInterval(()=>{render();if(selected!==null&&$('modal').style.display==='block')renderTasks()},60000);
</script></body></html>
