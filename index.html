<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f5fbf">
<title>Censo Gineco-Obstetricia</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f7fb}#app{display:block;width:100%;height:100%;border:0;background:#f5f7fb}</style>
</head>
<body>
<iframe id="app" src="app-base.html" title="Censo Gineco-Obstetricia"></iframe>
<script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{
  try{
    const d=frame.contentDocument;if(!d||d.getElementById('doctorasModule'))return;
    const load=(id,src,next)=>{const x=d.createElement('script');x.id=id;x.src=src;if(next){x.onload=next;x.onerror=next}d.body.appendChild(x)};
    load('doctorasModule','doctoras.js?v=3',()=>load('impresionModule','impresion.js?v=4',()=>load('altaModule','alta.js?v=4',()=>load('procedimientosModule','procedimientos.js?v=1',()=>load('laboratoriosModule','laboratorios.js?v=3',()=>load('tabletFormModule','tablet-form.js?v=1',()=>load('smartMedsModule','medicacion-inteligente.js?v=4',()=>load('availableBedsModule','camas-disponibles.js?v=6',()=>load('allBedsVisualModule','vista-todas.js?v=1',()=>load('pregnantColorModule','color-embarazadas.js?v=3',()=>load('moveBedModule','cambio-cama.js?v=1',()=>load('deleteTasksModule','eliminar-pendientes.js?v=1',()=>load('patientFiltersModule','filtros-pacientes.js?v=1',()=>load('guardModule','guardia.js?v=1',()=>load('dxAcceptModule','diagnosticos-aceptar.js?v=1',()=>load('connectionSafeModule','conexion-segura.js?v=2',()=>load('familyInfoModule','informacion-familiar-v3.js?v=2',()=>load('registryExcelModule','registro-excel.js?v=5',()=>load('puerperalDischargesModule','altas-puerperios.js?v=4'))))))))))))))))))));
    setTimeout(()=>{
      const force=(id,src)=>{if(d.getElementById(id))return;const s=d.createElement('script');s.id=id;s.src=src;d.body.appendChild(s)};
      force('pregnantColorModuleForce','color-embarazadas.js?v=3');
      force('familyInfoModuleForce','informacion-familiar-v3.js?v=2');
      force('puerperalDischargesModuleForce','altas-puerperios.js?v=4');
    },1200);
  }catch(e){console.error(e)}
});
</script>
</body>
</html>
