<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f5fbf">
<title>Censo Gineco-Obstetricia</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f7fb}#app{display:block;width:100%;height:100%;border:0;background:#f5f7fb}</style>
</head>
<body>
<iframe id="app" src="app-base.html?v=20260913-1800" title="Censo Gineco-Obstetricia"></iframe>
<script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{
  const d=frame.contentDocument;if(!d)return;
  const modules=[
    ['doctorasModule','doctoras.js?v=3'],
    ['impresionModule','impresion.js?v=10'],
    ['altaModule','alta.js?v=6'],
    ['procedimientosModule','procedimientos.js?v=1'],
    ['laboratoriosModule','laboratorios.js?v=3'],
    ['tabletFormModule','tablet-form.js?v=1'],
    ['quickPendingModule','acceso-pendientes.js?v=3'],
    ['smartMedsModule','medicacion-inteligente.js?v=4'],
    ['availableBedsModule','camas-disponibles.js?v=6'],
    ['allBedsVisualModule','vista-todas.js?v=1'],
    ['pregnantColorModule','color-embarazadas.js?v=6'],
    ['moveBedModule','cambio-cama.js?v=1'],
    ['deleteTasksModule','eliminar-pendientes.js?v=1'],
    ['patientFiltersModule','filtros-pacientes.js?v=1'],
    ['guardModule','guardia.js?v=1'],
    ['dxAcceptModule','diagnosticos-aceptar.js?v=1'],
    ['connectionSafeModule','conexion-segura.js?v=2'],
    ['familyInfoModule','informacion-familiar-v3.js?v=4'],
    ['registryExcelModule','registro-excel.js?v=5'],
    ['puerperalDischargesModule','altas-puerperios.js?v=8']
  ];
  modules.forEach(([id,src],i)=>setTimeout(()=>{
    if(d.getElementById(id))return;
    const s=d.createElement('script');s.id=id;s.src=src;d.body.appendChild(s);
  },i*80));
});
</script>
</body>
</html>
