<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f5fbf">
<title>Censo Gineco-Obstetricia</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f7fb}#app{display:block;width:100%;height:100%;border:0;background:#f5f7fb}</style>
</head>
<body>
<iframe id="app" src="app-base.html" title="Censo Gineco-Obstetricia"></iframe>
<script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{
  try{
    const d=frame.contentDocument;
    if(!d||d.getElementById('doctorasModule'))return;
    const s=d.createElement('script');
    s.id='doctorasModule';
    s.src='doctoras.js?v=1';
    d.body.appendChild(s);
  }catch(e){console.error(e)}
});
</script>
</body>
</html>
