<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1f5fbf">
<title>Censo Gineco-Obstetricia</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f5f7fb;color:#172033}header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #dde3ec;padding:12px}.headrow{display:flex;align-items:center;gap:10px;margin-bottom:8px}h1{font-size:20px;margin:0;flex:1}.search{flex:0 1 390px}.search input{width:100%;border:1px solid #cbd5e1;border-radius:999px;padding:9px 13px;font-size:14px;background:#f8fafc}.sum{display:flex;gap:6px;flex-wrap:wrap}.pill{background:#eef2f7;border:1px solid #d9e0ea;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:700;cursor:pointer}.pill.active{background:#1f5fbf;color:#fff;border-color:#1f5fbf}main{padding:12px;max-width:1200px;margin:auto}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.tabs button{white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.bed{min-height:122px;border:2px solid #a8b0ba;border-radius:12px;padding:10px;text-align:left;background:#edf1f5}.bed.preg{background:#fff3cd;border-color:#e6b800}.bed.puer{background:#ffe0ec;border-color:#d94f8a}.bed.gyn{background:#dceeff;border-color:#3986c6}.top{display:flex;justify-content:space-between;gap:6px}.id{font-weight:800}.badge{font-size:10px;background:#ffffffa8;padding:3px 6px;border-radius:999px}.name{font-weight:700;margin-top:8px;font-size:13px}.dx{font-size:11px;margin-top:4px;color:#475569}.task{font-size:11px;font-weight:800;margin-top:7px}.task.pending{color:#8a5a00}.task.overdue{color:#b42318}.specials{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}.specialtag{font-size:9px;font-weight:800;padding:3px 6px;border-radius:999px;background:#fff;border:1px solid #f59e0b;color:#92400e}.empty{grid-column:1/-1;text-align:center;padding:30px;color:#64748b;background:#fff;border-radius:12px;border:1px dashed #cbd5e1}button,input,select,textarea{font:inherit}button{border:1px solid #cfd7e3;background:white;border-radius:9px;padding:10px;cursor:pointer}.primary{background:#1f5fbf;color:#fff;border-color:#1f5fbf}.danger{color:#b42318;background:#fff3f3}.demo{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}#modal{display:none;position:fixed;inset:0;background:#0007;z-index:30;padding:10px;overflow:auto}.panel{background:#fff;border-radius:16px;max-width:720px;margin:10px auto}.head{display:flex;justify-content:space-between;align-items:center;padding:14px;border-bottom:1px solid #e2e8f0}.body{padding:14px}.form{display:grid;gap:10px}.form label{font-size:12px;font-weight:700}.form input,.form select,.form textarea{display:block;width:100%;margin-top:4px;border:1px solid #cbd5e1;border-radius:9px;padding:10px;font-size:16px}.form textarea{min-height:68px}.specialbox{border:1px solid #dbe3ee;border-radius:10px;padding:10px;background:#f8fafc}.checks{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}.checks label{display:flex;align-items:center;gap:6px;font-size:13px}.checks input{width:auto;margin:0}.taskrow{display:grid;grid-template-columns:1fr 145px 110px;gap:6px}.taskitem{display:flex;gap:8px;align-items:flex-start;background:#f8fafc;border:1px solid #e2e8f0;border-radius:9px;padding:9px;margin-top:7px;font-size:13px}.taskitem input{width:auto;margin-top:3px}.tasktext{flex:1}.state{display:inline-block;font-size:10px;font-weight:800;padding:3px 6px;border-radius:999px;margin-bottom:4px}.state.pending{background:#fff7d6;color:#7a4c00}.state.overdue{background:#fee2e2;color:#991b1b}.state.done{background:#dcfce7;color:#166534}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}@media(max-width:600px){.headrow{align-items:stretch;gap:7px}h1{font-size:17px;display:flex;align-items:center}.search{flex:0 0 48%;min-width:0}.search input{font-size:13px;padding:9px 11px}.search input::placeholder{font-size:12px}.taskrow{grid-template-columns:1fr 1fr}.taskrow #taskText{grid-column:1/-1}}@media(min-width:700px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.form{grid-template-columns:1fr 1fr}.full{grid-column:1/-1}}
</style>
</head>
<body>
<header><div class="headrow"><h1>Censo Gineco-Obstetricia</h1><div class="search"><input id="search" type="search" placeholder="🔎 Buscar nombre, HC o cama"></div></div><div class="sum"><button class="pill" id="occ">0 ocupadas</button><button class="pill" id="free">60 disponibles</button><button class="pill" id="pend">0 pendientes</button></div></header>
<main><div class="tabs"><button data-sector="preg">🤰 Embarazadas</button><button data-sector="puer">👶 Puérperas</button><button data-sector="flex">♀ Ginecológicas / Puérperas</button></div><div class="demo"><button class="primary" id="demo">Cargar demostración</button><button id="reset">Vaciar demo</button></div><div id="beds" class="grid"></div></main>
<div id="modal"><div class="panel"><div class="head"><strong id="title">Cama</strong><button id="close">✕</button></div><div class="body"><form id="form" class="form"><label>Tipo<select id="type"><option value="">Disponible</option><option value="preg">Embarazada</option><option value="puer">Puérpera</option><option value="gyn">Ginecológica</option></select></label><label>Historia clínica<input id="hc"></label><label class="full">Nombre y apellidos<input id="name"></label><div class="full specialbox"><strong>⚠️ Condición especial</strong><div class="checks"><label><input type="checkbox" id="postICU"> Post-UCI</label><label><input type="checkbox" id="isolation"> Aislamiento</label><label><input type="checkbox" id="closeWatch"> Vigilancia estrecha</label></div></div><label class="full">Diagnósticos<textarea id="dx"></textarea></label><label class="full">Procedimiento<textarea id="proc"></textarea></label><label class="full">Kardex<textarea id="kardex"></textarea></label><label class="full">Plan<textarea id="plan"></textarea></label><label class="full">Laboratorios<textarea id="labs" placeholder="Pega aquí los resultados"></textarea></label><div class="full"><strong>Pendientes / recordatorios</strong><div class="taskrow"><input id="taskText" placeholder="Ej. Ecografía obstétrica"><input id="taskDate" type="date"><input id="taskTime" type="time"></div><button type="button" id="addTask">Añadir pendiente</button><div id="taskList"></div></div><div class="full actions"><button class="primary" type="submit">Guardar cama</button><button class="danger" type="button" id="release">Liberar cama</button></div></form></div></div></div>
<script>
const BED_IDS=['601','602','603-A','603-B','604-A','604-B','604-C','604-D','605-A','605-B','605-C','605-D','606-A','606-B','607-A','607-B','608-A','608-B','608-C','608-D','609-A','609-B','609-C','609-D','6010-A','6010-B','6010-C','6010-D','6011-A','6011-B','612','613','614-A','614-B','615-A','615-B','615-C','615-D','616-A','616-B','616-C','616-D','617-A','617-B','618-A','618-B','619-A','619-B','620-A','620-B','620-C','620-D','621-A','621-B','621-C','621-D','622-A','622-B','622-C','622-D'];
const KEY='censo_go_v2_realbeds';
let sector='preg',filter='sector',selected=null,beds;
const emptySpecial=()=>({postICU:false,isolation:false,closeWatch:false});
const makeBeds=()=>BED_IDS.map((id,i)=>({id,index:i,type:'',name:'',hc:'',dx:'',proc:'',kardex:'',plan:'',labs:'',special:emptySpecial(),tasks:[]}));
try{beds=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
if(!Array.isArray(beds)||beds.length!==60)beds=makeBeds();
beds=beds.map((b,i)=>({...makeBeds()[i],...b,id:BED_IDS[i],index:i,special:{...emptySpecial(),...(b.special||{})},tasks:Array.isArray(b.tasks)?b.tasks.map(t=>({text:t.text||'',date:t.date||'',time:t.time||'',done:!!t.done})):[]}));
const $=id=>document.getElementById(id),ranges={preg:[0,19],puer:[20,39],flex:[40,59]},label={preg:'Embarazada',puer:'Puérpera',gyn:'Ginecológica','':'Disponible'},icon={preg:'🤰',puer:'👶',gyn:'♀','':'○'};
function save(){localStorage.setItem(KEY,JSON.stringify(beds))}
function defaultType(i){return i<20?'preg':i<40?'puer':''}
function norm(s){return(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function localDate(d=new Date()){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+day}
function fmtDate(s){if(!s)return'';const p=s.split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:s}
function taskStatus(t){if(t.done)return'done';if(t.date&&t.time){const due=new Date(t.date+'T'+t.time+':00');if(new Date()>due)return'overdue'}return'pending'}
function taskSortValue(t){return (t.date||'9999-99-99')+' '+(t.time||'99:99')}
function earliestOpen(b){const x=b.tasks.filter(t=>taskStatus(t)!=='done').map(t=>({s:taskStatus(t),v:taskSortValue(t)}));x.sort((a,b)=>(a.s==='overdue'?0:1)-(b.s==='overdue'?0:1)||a.v.localeCompare(b.v));return x[0]||{s:'pending',v:'9999'} }
function filteredBeds(){const q=norm($('search').value.trim());if(q)return beds.filter(b=>norm(b.name).includes(q)||norm(b.hc).includes(q)||norm(b.id).includes(q));if(filter==='occupied')return beds.filter(b=>b.type);if(filter==='free')return beds.filter(b=>!b.type);if(filter==='pending')return beds.filter(b=>b.tasks.some(t=>taskStatus(t)!=='done')).sort((a,b)=>{const x=earliestOpen(a),y=earliestOpen(b);return(x.s==='overdue'?0:1)-(y.s==='overdue'?0:1)||x.v.localeCompare(y.v)});const[a,z]=ranges[sector];return beds.filter(b=>b.index>=a&&b.index<=z)}
function specialTags(b){const a=[];if(b.special.postICU)a.push('POST-UCI');if(b.special.isolation)a.push('AISLAMIENTO');if(b.special.closeWatch)a.push('VIGILANCIA');return a.length?'<div class="specials">'+a.map(x=>'<span class="specialtag">⚠️ '+x+'</span>').join('')+'</div>':''}
function render(){const box=$('beds');box.innerHTML='';const list=filteredBeds();if(!list.length)box.innerHTML='<div class="empty">No se encontraron pacientes o camas con esa búsqueda.</div>';list.forEach(b=>{const t=b.type||defaultType(b.index),unfinished=b.tasks.filter(x=>taskStatus(x)!=='done'),over=unfinished.filter(x=>taskStatus(x)==='overdue').length,pending=unfinished.length-over,btn=document.createElement('button');btn.className='bed '+(b.type||t||'');const taskBadges=(over?'<div class="task overdue">🔴 '+over+' vencido'+(over>1?'s':'')+'</div>':'')+(pending?'<div class="task pending">⏳ '+pending+' pendiente'+(pending>1?'s':'')+'</div>':'');btn.innerHTML='<div class="top"><span class="id">Cama '+b.id+'</span><span class="badge">'+icon[t]+' '+(b.type?label[b.type]:(b.index>=40?'Ginecológica / Puérpera':label[t]))+'</span></div><div class="name">'+(b.name||'Disponible')+'</div><div class="dx">'+(b.dx||'Toca para ingresar paciente')+'</div>'+specialTags(b)+taskBadges;btn.onclick=()=>openBed(b.index);box.appendChild(btn)});const occ=beds.filter(b=>b.type).length,unfinished=beds.flatMap(b=>b.tasks).filter(t=>taskStatus(t)!=='done'),over=unfinished.filter(t=>taskStatus(t)==='overdue').length;$('occ').textContent=occ+' ocupadas';$('free').textContent=(60-occ)+' disponibles';$('pend').textContent=unfinished.length+' pendientes'+(over?' · '+over+' vencidos':'');['occ','free','pend'].forEach(id=>$(id).classList.remove('active'));if(!$('search').value.trim()){if(filter==='occupied')$('occ').classList.add('active');if(filter==='free')$('free').classList.add('active');if(filter==='pending')$('pend').classList.add('active')}}
function openBed(i){selected=i;const b=beds[i];$('title').textContent='Cama '+b.id;['type','hc','name','dx','proc','kardex','plan','labs'].forEach(k=>$(k).value=b[k]||'');$('postICU').checked=!!b.special.postICU;$('isolation').checked=!!b.special.isolation;$('closeWatch').checked=!!b.special.closeWatch;$('taskDate').value=localDate();renderTasks();$('modal').style.display='block'}
function sync(){if(selected===null)return;const b=beds[selected];['type','hc','name','dx','proc','kardex','plan','labs'].forEach(k=>b[k]=$(k).value.trim());b.special={postICU:$('postICU').checked,isolation:$('isolation').checked,closeWatch:$('closeWatch').checked}}
function renderTasks(){const b=beds[selected],box=$('taskList');box.innerHTML='';if(!b.tasks.length){box.innerHTML='<div style="font-size:12px;color:#64748b;margin-top:6px">Sin pendientes.</div>';return}b.tasks.forEach(t=>{const st=taskStatus(t),row=document.createElement('div');row.className='taskitem';const cb=document.createElement('input');cb.type='checkbox';cb.checked=t.done;cb.onchange=()=>{t.done=cb.checked;save();renderTasks();render()};const text=document.createElement('div');text.className='tasktext';const badge=document.createElement('span');badge.className='state '+st;badge.textContent=st==='done'?'✅ REALIZADO':st==='overdue'?'🔴 VENCIDO':'⏳ PENDIENTE';const info=document.createElement('div');info.textContent=t.text+((t.date||t.time)?' · '+[t.date?fmtDate(t.date):'',t.time||''].filter(Boolean).join(' · '):'');if(st==='done'){info.style.textDecoration='line-through';info.style.opacity='.6'}text.append(badge,info);row.append(cb,text);box.appendChild(row)})}
document.querySelectorAll('[data-sector]').forEach(b=>b.onclick=()=>{sector=b.dataset.sector;filter='sector';$('search').value='';render()});
$('search').oninput=render;
$('occ').onclick=()=>{$('search').value='';filter=filter==='occupied'?'sector':'occupied';render()};
$('free').onclick=()=>{$('search').value='';filter=filter==='free'?'sector':'free';render()};
$('pend').onclick=()=>{$('search').value='';filter=filter==='pending'?'sector':'pending';render()};
$('close').onclick=()=>{$('modal').style.display='none'};
$('form').onsubmit=e=>{e.preventDefault();sync();save();render();$('modal').style.display='none'};
$('addTask').onclick=()=>{const text=$('taskText').value.trim();if(!text||selected===null)return;sync();beds[selected].tasks.push({text,date:$('taskDate').value,time:$('taskTime').value,done:false});$('taskText').value='';$('taskTime').value='';save();renderTasks();render()};
$('release').onclick=()=>{if(selected===null||!confirm('¿Liberar cama y borrar los datos de esta paciente?'))return;const id=beds[selected].id;beds[selected]={id,index:selected,type:'',name:'',hc:'',dx:'',proc:'',kardex:'',plan:'',labs:'',special:emptySpecial(),tasks:[]};save();render();$('modal').style.display='none'};
$('demo').onclick=()=>{beds=makeBeds();const today=new Date(),yesterday=new Date(today),tomorrow=new Date(today);yesterday.setDate(today.getDate()-1);tomorrow.setDate(today.getDate()+1);const Y=localDate(yesterday),T=localDate(today),M=localDate(tomorrow);beds[0]={...beds[0],type:'preg',name:'María P. (demo)',hc:'001234',dx:'Amenaza de parto pretérmino',plan:'Vigilancia materno-fetal',labs:'Hb 11.2 / Plaq 218000',special:{postICU:false,isolation:false,closeWatch:true},tasks:[{text:'Ecografía obstétrica',date:M,time:'09:00',done:false},{text:'NST',date:T,time:'08:00',done:true}]};beds[6]={...beds[6],type:'preg',name:'Laura M. (demo)',hc:'002518',dx:'Preeclampsia con signos de severidad',special:{postICU:true,isolation:false,closeWatch:true},tasks:[{text:'Control de laboratorio',date:Y,time:'16:00',done:false}]};beds[21]={...beds[21],type:'puer',name:'Ana C. (demo)',hc:'004321',dx:'Puerperio quirúrgico',proc:'Cesárea segmentaria',plan:'Control Hb y deambulación',labs:'Hb 9.8 / Hto 30',special:{postICU:false,isolation:true,closeWatch:false},tasks:[{text:'Valorar retiro de sonda',date:M,time:'08:00',done:false}]};beds[44]={...beds[44],type:'gyn',name:'Paciente G. (demo)',hc:'009876',dx:'Miomatosis uterina',proc:'Histerectomía',plan:'Control postoperatorio',special:emptySpecial(),tasks:[{text:'Revaloración médica',date:T,time:'06:00',done:true}]};save();render()};
$('reset').onclick=()=>{if(!confirm('¿Vaciar las 60 camas de la demo?'))return;beds=makeBeds();save();render()};
render();
setInterval(()=>{render();if(selected!==null&&$('modal').style.display==='block')renderTasks()},60000);
</script>
</body>
</html>
