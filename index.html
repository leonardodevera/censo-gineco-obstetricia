<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f5fbf">
<title>Censo Gineco-Obstetricia</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f7fb}#app{display:block;width:100%;height:100%;border:0;background:#f5f7fb}</style>
</head>
<body>
<iframe id="app" src="app-base.html" title="Censo Gineco-Obstetricia"></iframe>
<script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{
  try{
    const d=frame.contentDocument;if(!d||d.getElementById('doctorasModule'))return;
    const load=(id,src,next)=>{const x=d.createElement('script');x.id=id;x.src=src;if(next)x.onload=next;d.body.appendChild(x)};
    load('doctorasModule','doctoras.js?v=3',()=>load('impresionModule','impresion.js?v=4',()=>load('altaModule','alta.js?v=3',()=>load('procedimientosModule','procedimientos.js?v=1',()=>load('laboratoriosModule','laboratorios.js?v=3',()=>load('tabletFormModule','tablet-form.js?v=1',()=>load('smartMedsModule','medicacion-inteligente.js?v=4',()=>load('availableBedsModule','camas-disponibles.js?v=1'))))))));
  }catch(e){console.error(e)}
});
</script>
</body>
</html>
