<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1f5fbf"><title>Censo Gineco-Obstetricia</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f5f7fb;color:#172033}header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #dde3ec;padding:12px}.headrow{display:flex;align-items:center;gap:10px;margin-bottom:8px}h1{font-size:20px;margin:0;flex:1}.search{flex:0 1 390px}.search input{width:100%;border:1px solid #cbd5e1;border-radius:999px;padding:9px 13px;font-size:14px;background:#f8fafc}.sum{display:flex;gap:6px;flex-wrap:wrap}.pill{background:#eef2f7;border:1px solid #d9e0ea;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:700;cursor:pointer}.pill.active{background:#1f5fbf;color:#fff;border-color:#1f5fbf}main{padding:12px;max-width:1200px;margin:auto}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.tabs button{white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.bed{min-height:122px;border:2px solid #a8b0ba;border-radius:12px;padding:10px;text-align:left;background:#edf1f5}.bed.preg{background:#fff3cd;border-color:#e6b800}.bed.puer{background:#ffe0ec;border-color:#d94f8a}.bed.gyn{background:#dceeff;border-color:#3986c6}.top{display:flex;justify-content:space-between;gap:6px}.id{font-weight:800}.badge{font-size:10px;background:#ffffffa8;padding:3px 6px;border-radius:999px}.name{font-weight:700;margin-top:8px;font-size:13px}.dx{font-size:11px;margin-top:4px;color:#475569}.task{font-size:11px;color:#b42318;font-weight:700;margin-top:7px}.empty{grid-column:1/-1;text-align:center;padding:30px;color:#64748b;background:#fff;border-radius:12px;border:1px dashed #cbd5e1}button,input,select,textarea{font:inherit}button{border:1px solid #cfd7e3;background:white;border-radius:9px;padding:10px;cursor:pointer}.primary{background:#1f5fbf;color:#fff;border-color:#1f5fbf}.danger{color:#b42318;background:#fff3f3}.demo{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}#modal{display:none;position:fixed;inset:0;background:#0007;z-index:30;padding:10px;overflow:auto}.panel{background:#fff;border-radius:16px;max-width:720px;margin:10px auto}.head{display:flex;justify-content:space-between;align-items:center;padding:14px;border-bottom:1px solid #e2e8f0}.body{padding:14px}.form{display:grid;gap:10px}.form label{font-size:12px;font-weight:700}.form input,.form select,.form textarea{display:block;width:100%;margin-top:4px;border:1px solid #cbd5e1;border-radius:9px;padding:10px;font-size:16px}.form textarea{min-height:68px}.taskrow{display:grid;grid-template-columns:1fr 110px;gap:6px}.taskitem{display:flex;gap:8px;align-items:center;background:#f8fafc;border:1px solid #e2e8f0;border-radius:9px;padding:8px;margin-top:6px;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}@media(max-width:600px){.headrow{align-items:stretch;gap:7px}h1{font-size:17px;display:flex;align-items:center}.search{flex:0 0 48%;min-width:0}.search input{font-size:13px;padding:9px 11px}.search input::placeholder{font-size:12px}}@media(min-width:700px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.form{grid-template-columns:1fr 1fr}.full{grid-column:1/-1}}</style></head><body><header><div class="headrow"><h1>Censo Gineco-Obstetricia</h1><div class="search"><input id="search" type="search" placeholder="🔎 Buscar nombre, HC o cama"></div></div><div class="sum"><button class="pill" id="occ">0 ocupadas</button><button class="pill" id="free">60 disponibles</button><button class="pill" id="pend">0 pendientes</button></div></header><main><div class="tabs"><button data-sector="preg">🤰 Embarazadas</button><button data-sector="puer">👶 Puérperas</button><button data-sector="flex">♀ Ginecológicas / Puérperas</button></div><div class="demo"><button class="primary" id="demo">Cargar demostración</button><button id="reset">Vaciar demo</button></div><div id="beds" class="grid"></div></main><div id="modal"><div class="panel"><div class="head"><strong id="title">Cama</strong><button id="close">✕</button></div><div class="body"><form id="form" class="form"><label>Tipo<select id="type"><option value="">Disponible</option><option value="preg">Embarazada</option><option value="puer">Puérpera</option><option value="gyn">Ginecológica</option></select></label><label>Historia clínica<input id="hc"></label><label class="full">Nombre y apellidos<input id="name"></label><label class="full">Diagnósticos<textarea id="dx"></textarea></label><label class="full">Procedimiento<textarea id="proc"></textarea></label><label class="full">Kardex<textarea id="kardex"></textarea></label><label class="full">Plan<textarea id="plan"></textarea></label><label class="full">Laboratorios<textarea id="labs" placeholder="Pega aquí los resultados"></textarea></label><div class="full"><strong>Pendientes / recordatorios</strong><div class="taskrow"><input id="taskText" placeholder="Ej. Ecografía obstétrica"><input id="taskTime" type="time"></div><button type="button" id="addTask">Añadir pendiente</button><div id="taskList"></div></div><div class="full actions"><button class="primary" type="submit">Guardar cama</button><button class="danger" type="button" id="release">Liberar cama</button></div></form></div></div></div><script>const BED_IDS=['601','602','603-A','603-B','604-A','604-B','604-C','604-D','605-A','605-B','605-C','605-D','606-A','606-B','607-A','607-B','608-A','608-B','608-C','608-D','609-A','609-B','609-C','609-D','6010-A','6010-B','6010-C','6010-D','6011-A','6011-B','612','613','614-A','614-B','615-A','615-B','615-C','615-D','616-A','616-B','616-C','616-D','617-A','617-B','618-A','618-B','619-A','619-B','620-A','620-B','620-C','620-D','621-A','621-B','621-C','621-D','622-A','622-B','622-C','622-D'];const KEY='censo_go_v2_realbeds';let sector='preg',filter='sector',selected=null,beds;const makeBeds=()=>BED_IDS.map((id,i)=>({id,index:i,type:'',name:'',hc:'',dx:'',proc:'',kardex:'',plan:'',labs:'',tasks:[]}));try{beds=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}if(!Array.isArray(beds)||beds.length!==60)beds=makeBeds();const $=id=>document.getElementById(id),ranges={preg:[0,19],puer:[20,39],flex:[40,59]},label={preg:'Embarazada',puer:'Puérpera',gyn:'Ginecológica','':'Disponible'},icon={preg:'🤰',puer:'👶',gyn:'♀','':'○'};function save(){localStorage.setItem(KEY,JSON.stringify(beds))}function defaultType(i){return i<20?'preg':i<40?'puer':''}function norm(s){return(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}function filteredBeds(){const q=norm($('search').value.trim());if(q)return beds.filter(b=>norm(b.name).includes(q)||norm(b.hc).includes(q)||norm(b.id).includes(q));if(filter==='occupied')return beds.filter(b=>b.type);if(filter==='free')return beds.filter(b=>!b.type);if(filter==='pending')return beds.filter(b=>b.tasks.some(t=>!t.done)).sort((a,b)=>{const ta=a.tasks.filter(t=>!t.done&&t.time).map(t=>t.time).sort()[0]||'99:99',tb=b.tasks.filter(t=>!t.done&&t.time).map(t=>t.time).sort()[0]||'99:99';return ta.localeCompare(tb)});const[a,z]=ranges[sector];return beds.filter(b=>b.index>=a&&b.index<=z)}function render(){const box=$('beds');box.innerHTML='';const list=filteredBeds();if(!list.length)box.innerHTML='<div class="empty">No se encontraron pacientes o camas con esa búsqueda.</div>';list.forEach(b=>{const t=b.type||defaultType(b.index),p=b.tasks.filter(x=>!x.done).length,btn=document.createElement('button');btn.className='bed '+(b.type||t||'');btn.innerHTML='<div class="top"><span class="id">Cama '+b.id+'</span><span class="badge">'+icon[t]+' '+(b.type?label[b.type]:(b.index>=40?'Ginecológica / Puérpera':label[t]))+'</span></div><div class="name">'+(b.name||'Disponible')+'</div><div class="dx">'+(b.dx||'Toca para ingresar paciente')+'</div>'+(p?'<div class="task">⏰ '+p+' pendiente'+(p>1?'s':'')+'</div>':'');btn.onclick=()=>openBed(b.index);box.appendChild(btn)});const occ=beds.filter(b=>b.type).length,p=beds.reduce((n,b)=>n+b.tasks.filter(t=>!t.done).length,0);$('occ').textContent=occ+' ocupadas';$('free').textContent=(60-occ)+' disponibles';$('pend').textContent=p+' pendientes';['occ','free','pend'].forEach(id=>$(id).classList.remove('active'));if(!$('search').value.trim()){if(filter==='occupied')$('occ').classList.add('active');if(filter==='free')$('free').classList.add('active');if(filter==='pending')$('pend').classList.add('active')}}function openBed(i){selected=i;const b=beds[i];$('title').textContent='Cama '+b.id;['type','hc','name','dx','proc','kardex','plan','labs'].forEach(k=>$(k).value=b[k]||'');renderTasks();$('modal').style.display='block'}function sync(){if(selected===null)return;const b=beds[selected];['type','hc','name','dx','proc','kardex','plan','labs'].forEach(k=>b[k]=$(k).value.trim())}function renderTasks(){const b=beds[selected],box=$('taskList');box.innerHTML='';if(!b.tasks.length){box.innerHTML='<div style="font-size:12px;color:#64748b;margin-top:6px">Sin pendientes.</div>';return}b.tasks.forEach(t=>{const row=document.createElement('label');row.className='taskitem';const cb=document.createElement('input');cb.type='checkbox';cb.checked=t.done;cb.style.width='auto';cb.onchange=()=>{t.done=cb.checked;save();renderTasks();render()};const s=document.createElement('span');s.textContent=t.text+(t.time?' · '+t.time:'');if(t.done){s.style.textDecoration='line-through';s.style.opacity='.55'}row.append(cb,s);box.appendChild(row)})}document.querySelectorAll('[data-sector]').forEach(b=>b.onclick=()=>{sector=b.dataset.sector;filter='sector';$('search').value='';render()});$('search').oninput=render;$('occ').onclick=()=>{$('search').value='';filter=filter==='occupied'?'sector':'occupied';render()};$('free').onclick=()=>{$('search').value='';filter=filter==='free'?'sector':'free';render()};$('pend').onclick=()=>{$('search').value='';filter=filter==='pending'?'sector':'pending';render()};$('close').onclick=()=>{$('modal').style.display='none'};$('form').onsubmit=e=>{e.preventDefault();sync();save();render();$('modal').style.display='none'};$('addTask').onclick=()=>{const text=$('taskText').value.trim();if(!text||selected===null)return;sync();beds[selected].tasks.push({text,time:$('taskTime').value,done:false});$('taskText').value='';$('taskTime').value='';save();renderTasks();render()};$('release').onclick=()=>{if(selected===null||!confirm('¿Liberar cama y borrar los datos de esta paciente?'))return;const id=beds[selected].id;beds[selected]={id,index:selected,type:'',name:'',hc:'',dx:'',proc:'',kardex:'',plan:'',labs:'',tasks:[]};save();render();$('modal').style.display='none'};$('demo').onclick=()=>{beds=makeBeds();beds[0]={...beds[0],type:'preg',name:'María P. (demo)',hc:'001234',dx:'Amenaza de parto pretérmino',plan:'Vigilancia materno-fetal',labs:'Hb 11.2 / Plaq 218000',tasks:[{text:'Ecografía obstétrica',time:'14:00',done:false},{text:'NST',time:'11:30',done:false}]};beds[21]={...beds[21],type:'puer',name:'Ana C. (demo)',hc:'004321',dx:'Puerperio quirúrgico',proc:'Cesárea segmentaria',plan:'Control Hb y deambulación',labs:'Hb 9.8 / Hto 30',tasks:[{text:'Valorar retiro de sonda',time:'12:00',done:false}]};beds[44]={...beds[44],type:'gyn',name:'Paciente G. (demo)',hc:'009876',dx:'Miomatosis uterina',proc:'Histerectomía',plan:'Control postoperatorio',tasks:[{text:'Revaloración médica',time:'15:00',done:false}]};save();render()};$('reset').onclick=()=>{if(!confirm('¿Vaciar las 60 camas de la demo?'))return;beds=makeBeds();save();render()};render();</script></body></html>
