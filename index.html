const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const BED_IDS=['601','602','603-A','603-B','604-A','604-B','604-C','604-D','605-A','605-B','605-C','605-D','606-A','606-B','607-A','607-B','608-A','608-B','608-C','608-D','609-A','609-B','609-C','609-D','6010-A','6010-B','6010-C','6010-D','6011-A','6011-B','612','613','614-A','614-B','615-A','615-B','615-C','615-D','616-A','616-B','616-C','616-D','617-A','617-B','618-A','618-B','619-A','619-B','620-A','620-B','620-C','620-D','621-A','621-B','621-C','621-D','622-A','622-B','622-C','622-D'];

function emptySpecial(){return{postICU:false,isolation:false,closeWatch:false}}function makeBeds(){return BED_IDS.map((id,index)=>({id,index,type:'',name:'',hc:'',dx:'',proc:'',kardex:'',plan:'',birthType:'',eventDate:'',eventTime:'',labEntries:[],special:emptySpecial(),tasks:[]}))}const $=id=>document.getElementById(id),ranges={preg:[0,19],puer:[20,39],flex:[40,59]},label={preg:'Embarazada',puer:'Puérpera',gyn:'Ginecológica','':'Disponible'},icon={preg:'🤰',puer:'👶',gyn:'♀','':'○'};

function mapBedRow(r,i){return{id:r.id,index:i,type:r.type||'',name:r.name||'',hc:r.hc||'',dx:r.dx||'',proc:r.proc||'',kardex:r.kardex||'',plan:r.plan||'',birthType:r.birth_type||'',eventDate:r.event_date||'',eventTime:(r.event_time||'').slice(0,5),labEntries:[],special:{postICU:!!r.post_icu,isolation:!!r.isolation,closeWatch:!!r.close_watch},tasks:[]}}
async function fetchCloud(){let [br,lr,tr]=await Promise.all([sb.from('beds').select('*'),sb.from('lab_entries').select('*').order('created_at',{ascending:true}),sb.from('tasks').select('*').order('created_at',{ascending:true})]);if(br.error)throw br.error;if(lr.error)throw lr.error;if(tr.error)throw tr.error;let rows=new Map((br.data||[]).map(r=>[r.id,r]));let next=BED_IDS.map((id,i)=>rows.has(id)?mapBedRow(rows.get(id),i):makeBeds()[i]);(lr.data||[]).forEach(r=>{let b=next.find(x=>x.id===r.bed_id);if(b)b.labEntries.push({id:r.id,date:r.lab_date||'',time:(r.lab_time||'').slice(0,5),raw:r.raw||''})});(tr.data||[]).forEach(r=>{let b=next.find(x=>x.id===r.bed_id);if(b)b.tasks.push({id:r.id,text:r.text||'',date:r.task_date||'',time:(r.task_time||'').slice(0,5),done:!!r.done,note:r.note||''})});return next}
async function migrateLocalIfNeeded(cloudBeds){let local=localSnapshot();if(hasClinicalData(cloudBeds)||!hasClinicalData(local))return false;cloudMsg('☁️ Migrando datos…');for(let i=0;i<BED_IDS.length;i++){let src=local[i];if(!src)continue;let b={...makeBeds()[i],...src,id:BED_IDS[i],index:i,labEntries:Array.isArray(src.labEntries)?src.labEntries:[],tasks:Array.isArray(src.tasks)?src.tasks:[],special:{...emptySpecial(),...(src.special||{})}};if(hasClinicalData([b]))await persistBed(b)}localStorage.setItem('censo_go_cloud_migrated','1');return true}

function bedPayload(b){return{id:b.id,type:b.type||'',name:b.name||'',hc:b.hc||'',dx:b.dx||'',proc:b.proc||'',kardex:b.kardex||'',plan:b.plan||'',birth_type:b.birthType||'',event_date:b.eventDate||null,event_time:b.eventTime||null,post_icu:!!b.special.postICU,isolation:!!b.special.isolation,close_watch:!!b.special.closeWatch,updated_at:new Date().toISOString(),updated_by:currentUser?currentUser.id:null}}

function save(){if(selected===null)return;let snapshot=JSON.parse(JSON.stringify(beds[selected]));cloudMsg('☁️ Guardando…');saveChain=saveChain.then(()=>persistBed(snapshot)).then(()=>{cloudMsg('☁️ Guardado')}).catch(e=>{console.error(e);cloudMsg('☁️ No se pudo guardar',true)});return saveChain}

async function initAuth(){try{let {data,error}=await sb.auth.getSession();if(error)throw error;applyAuth(data.session)}catch(e){$('loginError').textContent='No se pudo verificar la sesión. Intenta nuevamente.'}}
function norm(s){return(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}function defaultType(i){return i<20?'preg':i<40?'puer':''}function localDate(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function fmtDate(s){if(!s)return'';let p=s.split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:s}function taskStatus(t){if(t.done)return'done';if(t.date&&t.time&&new Date()>new Date(t.date+'T'+t.time+':00'))return'overdue';return'pending'}
function dxItems(raw){let lines=String(raw||'').replace(/\r/g,'\n').split(/\n+/).map(x=>x.trim()).filter(Boolean);if(lines.length<=1){let numbered=String(raw||'').trim().split(/\s+(?=\d+[.)-]\s*)/).map(x=>x.trim()).filter(Boolean);if(numbered.length>1)lines=numbered}return lines.map(x=>x.replace(/^\s*(?:\d+\s*[.)-]|[-•])\s*/,'').trim()).filter(Boolean)}function dxCardHtml(raw){let a=dxItems(raw);if(!a.length)return'<div class="dx">Toca para ingresar paciente</div>';let shown=a.slice(0,2);return'<div class="dx"><div class="dxlist">'+shown.map((x,i)=>'<div class="dxitem"><span class="dxnum">'+(i+1)+'.</span><span>'+esc(x)+'</span></div>').join('')+'</div>'+(a.length>2?'<div class="dxmore">+'+(a.length-2)+' diagnóstico(s)</div>':'')+'</div>'}function dxHandoffHtml(raw){let a=dxItems(raw);if(!a.length)return'';return'<div class="handoffLine"><b>Diagnósticos:</b><ol class="handoffDx">'+a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol></div>'}
function eventHtml(b){if(!b.type)return'';if(b.type==='puer'&&(b.birthType||b.eventDate||b.eventTime)){let n=b.birthType==='cesarea'?'CESÁREA':b.birthType==='parto'?'PARTO':'',cl=b.birthType==='cesarea'?'cesarea':'parto',when=[fmtDate(b.eventDate),b.eventTime].filter(Boolean).join(' · ');return'<div class="eventline">'+(n?'<span class="birthType '+cl+'">'+n+'</span>':'')+(n&&when?' · ':'')+(when?'Nacimiento: '+when:'')+'</div>'}if(b.type==='gyn'&&b.eventDate)return'<div class="eventline">Procedimiento: '+fmtDate(b.eventDate)+'</div>';return''}
function specialTags(b){let a=[];if(b.special.postICU)a.push('POST-UCI');if(b.special.isolation)a.push('AISLAMIENTO');if(b.special.closeWatch)a.push('VIGILANCIA');return a.length?'<div class="specials">'+a.map(x=>'<span class="specialtag">⚠️ '+x+'</span>').join('')+'</div>':''}function filteredBeds(){let q=norm($('search').value.trim());if(q)return beds.filter(b=>norm(b.name).includes(q)||norm(b.hc).includes(q)||norm(b.id).includes(q));if(filter==='occupied')return beds.filter(b=>b.type);if(filter==='free')return beds.filter(b=>!b.type);if(filter==='pending')return beds.filter(b=>b.tasks.some(t=>taskStatus(t)!=='done'));let r=ranges[sector];return beds.filter(b=>b.index>=r[0]&&b.index<=r[1])}
function render(){let box=$('beds');box.innerHTML='';let list=filteredBeds();if(!list.length)box.innerHTML='<div class="empty">No se encontraron camas.</div>';list.forEach(b=>{let t=b.type||defaultType(b.index),u=b.tasks.filter(x=>taskStatus(x)!=='done'),o=u.filter(x=>taskStatus(x)==='overdue').length,p=u.length-o,btn=document.createElement('button');btn.className='bed '+(b.type||t||'');btn.innerHTML='<div class="top"><span class="id">Cama '+b.id+'</span><span class="badge">'+icon[t]+' '+(b.type?label[b.type]:(b.index>=40?'Ginecológica / Puérpera':label[t]))+'</span></div><div class="name">'+(b.name||'Disponible')+'</div>'+dxCardHtml(b.dx)+eventHtml(b)+specialTags(b)+(o?'<div class="task overdue">🔴 '+o+' vencido(s)</div>':'')+(p?'<div class="task pending">⏳ '+p+' pendiente(s)</div>':'');btn.onclick=()=>openBed(b.index);box.appendChild(btn)});let occ=beds.filter(b=>b.type).length,u=beds.flatMap(b=>b.tasks).filter(t=>taskStatus(t)!=='done'),o=u.filter(t=>taskStatus(t)==='overdue').length;$('occ').textContent=occ+' ocupadas';$('free').textContent=(60-occ)+' disponibles';$('pend').textContent=u.length+' pendientes'+(o?' · '+o+' vencidos':'')}
function updateEventFields(){let t=$('type').value,isP=t==='puer',isG=t==='gyn';$('eventBox').style.display=(isP||isG)?'block':'none';$('birthTypeLabel').style.display=isP?'block':'none';$('eventTimeWrap').style.display=isP?'block':'none';$('eventTitle').textContent=isP?'Datos del nacimiento':'Datos del procedimiento';$('eventDateLabel').textContent=isP?'Fecha del nacimiento':'Fecha del procedimiento';$('eventTimeLabel').textContent='Hora del nacimiento';if(isG)$('eventTime').value=''}
function parseLabMeta(raw){let m=raw.match(/(?:^|\n)\s*(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})(?:\s+(?:Hora\s*:?\s*)?(\d{1,2}):(\d{2}))?/i);if(!m)return{date:'',time:''};return{date:m[1]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[3]).padStart(2,'0'),time:m[4]?String(m[4]).padStart(2,'0')+':'+m[5]:''}}function cleanLabLine(s){return s.replace(/\.+\s*:/,':').replace(/\s+/g,' ').trim()}function labGroup(x){let n=norm(x);if(/hemoglob|\bhgb\b|\bhb\b|hematoc|\bhct\b|\bhto\b|leucoc|wbc|neutro|linfoc|monoc|eosin|basof|plaquet|plt|eritroc|rbc|vcm|hcm|chcm|rdw/.test(n))return'Hemograma';if(/glucos|urea|bun|creatin|acido uric|proteina total|albumin/.test(n))return'Química';if(/\btgo\b|\bast\b|\btgp\b|\balt\b|bilirr|fosfatasa|ggt|ldh/.test(n))return'Función hepática';if(/\btp\b|protrom|inr|ttp|aptt|fibrin|dimero/.test(n))return'Coagulación';if(/\bpcr\b|proteina c reactiva|procalciton|vsg/.test(n))return'Inflamación';if(/sodio|\bna\b|potasio|\bk\b|cloro|calcio|magnesio|fosforo/.test(n))return'Electrolitos';if(/orina|bacter|nitrito|esterasa|densidad|urobil|ceton/.test(n))return'Orina';return'Otros'}function parseLabItems(raw){return raw.replace(/\r/g,'\n').split(/\n+|\s+\/\s+/).map(cleanLabLine).filter(x=>x&&!/^\d{4}[\/\-]\d{1,2}[\/\-]\d{1,2}(?:\s+Hora)?/i.test(x)).map(x=>{let m=x.match(/^(.+?)\s*:\s*(.+)$/);if(!m)m=x.match(/^(.+?)\s+(-?\d[\d.,]*\s*%?)$/);return{name:(m?m[1]:x).trim(),value:(m?m[2]:'').trim(),raw:x,group:labGroup(x)}})}function stamp(e){return e.date?(fmtDate(e.date)+(e.time?' · '+e.time:'')):'Fecha no identificada'}function sortedEntries(b){return(b.labEntries||[]).slice().sort((a,z)=>((z.date||'')+' '+(z.time||'')).localeCompare((a.date||'')+' '+(a.time||'')))}function renderLabEntry(e){let box=$('labView'),items=parseLabItems(e.raw),groups={};items.forEach(x=>(groups[x.group]||(groups[x.group]=[])).push(x.raw));box.innerHTML='<div class="labhint">Toma: <b>'+stamp(e)+'</b></div>';['Hemograma','Química','Función hepática','Coagulación','Inflamación','Electrolitos','Orina','Otros'].forEach(g=>{if(!groups[g])return;box.innerHTML+='<div class="labgroup"><div class="labtitle">'+g+'</div><div class="labchips">'+groups[g].map(x=>'<span class="labchip">'+x+'</span>').join('')+'</div></div>'})}function renderLabTabs(){let b=beds[selected],entries=sortedEntries(b),tabs=$('labTabs'),view=$('labView');tabs.innerHTML='';view.innerHTML='';$('compareLabs').style.display=entries.length>=2?'inline-block':'none';if(!entries.length){view.innerHTML='<div class="labhint">Sin tomas guardadas.</div>';return}if(activeLab>=entries.length)activeLab=0;entries.forEach((e,i)=>{let bt=document.createElement('button');bt.type='button';bt.className='labtab '+(i===activeLab?'active':'');bt.textContent='🧪 '+stamp(e);bt.onclick=()=>{activeLab=i;renderLabTabs()};tabs.appendChild(bt)});renderLabEntry(entries[activeLab])}function labNumber(v){let m=String(v||'').replace(',','.').match(/-?\d+(?:\.\d+)?/);return m?Number(m[0]):null}function compareLabs(){let entries=sortedEntries(beds[selected]).slice().reverse();if(entries.length<2)return;let map={},names={};entries.forEach((e,i)=>parseLabItems(e.raw).forEach(x=>{let k=norm(x.name).replace(/\([^)]*\)/g,'').trim();names[k]=x.name;(map[k]||(map[k]=Array(entries.length).fill('—')))[i]=x.value||x.raw}));let html='<div class="trendLegend">↑ subió · ↓ bajó · → sin cambio. Comparación numérica con la toma anterior.</div><div class="compare"><table><thead><tr><th>Examen</th>'+entries.map(e=>'<th>'+stamp(e)+'</th>').join('')+'</tr></thead><tbody>';Object.keys(map).forEach(k=>{let vals=map[k];html+='<tr><td>'+esc(names[k])+'</td>';vals.forEach((v,i)=>{let trend='';if(i>0&&v!=='—'&&vals[i-1]!=='—'){let cur=labNumber(v),prev=labNumber(vals[i-1]);if(cur!==null&&prev!==null){if(cur>prev)trend='<span class="trend up" title="Subió respecto a la toma anterior">↑</span>';else if(cur<prev)trend='<span class="trend down" title="Bajó respecto a la toma anterior">↓</span>';else trend='<span class="trend same" title="Sin cambio respecto a la toma anterior">→</span>'}}html+='<td>'+esc(v)+trend+'</td>'});html+='</tr>'});$('labView').innerHTML=html+'</tbody></table></div>'}
function openBed(i){selected=i;activeLab=0;let b=beds[i];$('title').textContent='Cama '+b.id;['type','hc','name','dx','proc','kardex','plan'].forEach(k=>$(k).value=b[k]||'');$('birthType').value=b.birthType||'';$('eventDate').value=b.eventDate||'';$('eventTime').value=b.eventTime||'';updateEventFields();$('labs').value='';$('postICU').checked=!!b.special.postICU;$('isolation').checked=!!b.special.isolation;$('closeWatch').checked=!!b.special.closeWatch;$('taskDate').value=localDate();renderTasks();renderLabTabs();$('modal').style.display='block'}function sync(){if(selected===null)return;let b=beds[selected];['type','hc','name','dx','proc','kardex','plan'].forEach(k=>b[k]=$(k).value.trim());b.birthType=$('birthType').value;b.eventDate=$('eventDate').value;b.eventTime=b.type==='gyn'?'':$('eventTime').value;b.special={postICU:$('postICU').checked,isolation:$('isolation').checked,closeWatch:$('closeWatch').checked}}function renderTasks(){let b=beds[selected],box=$('taskList');box.innerHTML='';if(!b.tasks.length){box.innerHTML='<div class="labhint">Sin pendientes.</div>';return}b.tasks.forEach(t=>{let st=taskStatus(t),row=document.createElement('div');row.className='taskitem';let cb=document.createElement('input');cb.type='checkbox';cb.checked=t.done;cb.disabled=st==='overdue';cb.onchange=()=>{t.done=cb.checked;save();renderTasks();render()};let tx=document.createElement('div');tx.className='tasktext';tx.innerHTML='<span class="state '+st+'">'+(st==='done'?'✅ REALIZADO':st==='overdue'?'🔴 VENCIDO':'⏳ PENDIENTE')+'</span><div>'+t.text+' · '+[fmtDate(t.date),t.time].filter(Boolean).join(' · ')+'</div>';if(st==='overdue'){if(t.note)tx.innerHTML+='<div class="tasknote">📝 '+t.note+'</div>';else{let bt=document.createElement('button');bt.type='button';bt.className='noteBtn';bt.textContent='📝 Agregar nota aclaratoria';bt.onclick=()=>{let n=prompt('Escribe la nota aclaratoria:');if(n&&n.trim()){t.note=n.trim();save();renderTasks()}};tx.appendChild(bt)}}row.append(cb,tx);box.appen function esc(s){return String(s||'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function latestLab(b){let e=(b.labEntries||[]).slice().sort((a,z)=>((z.date||'')+' '+(z.time||'')).localeCompare((a.date||'')+' '+(a.time||'')));return e[0]||null}function handoffSpecial(b){let a=[];if(b.special&&b.special.postICU)a.push('POST-UCI');if(b.special&&b.special.isolation)a.push('AISLAMIENTO');if(b.special&&b.special.closeWatch)a.push('VIGILANCIA ESTRECHA');return a}function handoffTaskHtml(t){let st=taskStatus(t),tag=st==='overdue'?'🔴 VENCIDO':st==='done'?'✅ REALIZADO':'⏳ PENDIENTE',when=[fmtDate(t.date),t.time].filter(Boolean).join(' · ');return'<div class="handoffTask">'+tag+' — '+esc(t.text)+(when?' · '+esc(when):'')+(t.note?' · 📝 '+esc(t.note):'')+'</div>'}function openFromHandoff(i){$('handoffModal').style.display='none';openBed(i)}
function handoffEvent(b){if(b.type==='puer'&&(b.birthType||b.eventDate||b.eventTime)){let n=b.birthType==='cesarea'?'CESÁREA':b.birthType==='parto'?'PARTO':'',cl=b.birthType==='cesarea'?'cesarea':'parto',when=[fmtDate(b.eventDate),b.eventTime].filter(Boolean).join(' · ');return'<div class="handoffLine"><b>Nacimiento:</b> '+(n?'<span class="birthType '+cl+'">'+n+'</span>':'')+(n&&when?' · ':'')+esc(when)+'</div>'}if(b.type==='gyn'&&b.eventDate)return'<div class="handoffLine"><b>Fecha de procedimiento:</b> '+esc(fmtDate(b.eventDate))+'</div>';return''}
function renderHandoff(){let box=$('handoffBody'),occupied=beds.filter(b=>b.type),now=new Date();box.innerHTML='<div class="handoffMeta">Generado: '+now.toLocaleDateString('es-EC')+' · '+now.toLocaleTimeString('es-EC',{hour:'2-digit',minute:'2-digit'})+' · '+occupied.length+' camas ocupadas</div>';if(!occupied.length){box.innerHTML+='<div class="empty">No hay pacientes hospitalizadas.</div>';return}let sectors=[['preg','🤰 Embarazadas'],['puer','👶 Puérperas'],['gyn','♀ Ginecológicas']];sectors.forEach(([type,title])=>{let list=occupied.filter(b=>b.type===type);if(!list.length)return;let h=document.createElement('h3');h.className='handoffSector';h.textContent=title;box.appendChild(h);list.forEach(b=>{let card=document.createElement('div');card.className='handoffCard '+type;card.onclick=()=>openFromHandoff(b.index);let sp=handoffSpecial(b),tasks=(b.tasks||[]).slice().sort((a,z)=>{let rank=x=>taskStatus(x)==='overdue'?0:taskStatus(x)==='pending'?1:2;return rank(a)-rank(z)||((a.date||'9999')+(a.time||'')).localeCompare((z.date||'9999')+(z.time||''))}),lab=latestLab(b),labHtml='';if(lab){let items=parseLabItems(lab.raw).slice(0,8).map(x=>esc(x.name)+': '+esc(x.value)).join(' · ');labHtml='<div class="handoffLab"><b>🧪 Última toma:</b> '+esc(fmtDate(lab.date)||'Fecha no identificada')+(lab.time?' · '+esc(lab.time):'')+(items?'<br>'+items:'')+'</div>'}card.innerHTML='<div class="handoffTop"><span class="bedno">Cama '+esc(b.id)+'</span><span class="handoffName">'+esc(b.name||'Sin nombre')+'</span><span class="handoffHC">HC: '+esc(b.hc||'—')+'</span></div>'+handoffEvent(b)+(sp.length?'<div class="handoffLine"><b>⚠️ Condición:</b> '+sp.map(esc).join(' · ')+'</div>':'')+dxHandoffHtml(b.dx)+(b.proc?'<div class="handoffLine"><b>Procedimiento:</b> '+esc(b.proc)+'</div>':'')+(b.plan?'<div class="handoffLine"><b>Plan:</b> '+esc(b.plan)+'</div>':'')+labHtml+(tasks.length?'<div class="handoffTasks"><b>Pendientes / recordatorios</b>'+tasks.map(handoffTaskHtml).join('')+'</div>':'');box.appendChild(card)})})}function showPdfPreview(){renderHandoff();let now=new Date(),clone=$('handoffBody').cloneNode(true);clone.querySelectorAll('.handoffCard').forEach(c=>{c.onclick=null;c.removeAttribute('onclick')});$('pdfSheet').innerHTML='<div class="pdfTitle">ENTREGA DE GUARDIA — GINECO-OBSTETRICIA</div><div class="pdfSub">'+now.toLocaleDateString('es-EC')+' · '+now.toLocaleTimeString('es-EC',{hour:'2-digit',minute:'2-digit'})+'</div>'+clone.innerHTML;$('pdfModal').style.display='block'}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginError').textContent='';let btn=$('loginBtn');btn.disabled=true;btn.textContent='Ingresando...';try{let {data,error}=await sb.auth.signInWithPassword({email:$('loginEmail').value.trim(),password:$('loginPassword').value});if(error)throw error;applyAuth(data.session)}catch(err){$('loginError').textContent='Correo o contraseña incorrectos.'}finally{btn.disabled=false;btn.textContent='Iniciar sesión'}};$('logout').onclick=async()=>{await sb.auth.signOut()};sb.auth.onAuthStateChange((_event,session)=>applyAuth(session));
$('type').onchange=updateEventFields;$('saveLab').onclick=()=>{let raw=$('labs').value.trim();if(!raw||selected===null)return;sync();let m=parseLabMeta(raw);beds[selected].labEntries.push({date:m.date,time:m.time,raw});$('labs').value='';activeLab=0;save();renderLabTabs()};$('compareLabs').onclick=compareLabs;$('handoff').onclick=()=>{renderHandoff();$('handoffModal').style.display='block'};$('closeHandoff').onclick=()=>$('handoffModal').style.display='none';$('printHandoff').onclick=showPdfPreview;$('closePdf').onclick=()=>$('pdfModal').style.display='none';$('finalPrint').onclick=()=>window.print();document.querySelectorAll('[data-sector]').forEach(b=>b.onclick=()=>{sector=b.dataset.sector;filter='sector';$('search').value='';render()});$('search').oninput=render;$('occ').onclick=()=>{filter=filter==='occupied'?'sector':'occupied';$('search').value='';render()};$('free').onclick=()=>{filter=filter==='free'?'sector':'free';$('search').value='';render()};$('pend').onclick=()=>{filter=filter==='pending'?'sector':'pending';$('search').value='';render()};$('close').onclick=()=>$('modal').style.display='none';$('form').onsubmit=e=>{e.preventDefault();sync();save();render();$('modal').style.display='none'};$('addTask').onclick=()=>{let text=$('taskText').value.trim();if(!text)return;sync();beds[selected].tasks.push({text,date:$('taskDate').value,time:$('taskTime').value,done:false,note:''});$('taskText').value='';$('taskTime').value='';save();renderTasks();render()};$('release').onclick=()=>{if(selected===null||!confirm('¿Liberar cama y borrar los datos de esta paciente?'))return;let i=selected,id=beds[i].id;beds[i]={...makeBeds()[i],id};save();render();$('modal').style.display='none'};render();initAuth();setInterval(()=>{render();if(currentUser&&$('modal').style.display!=='block')loadCloud();else if(selected!==null&&$('modal').style.display==='block')renderTasks()},15000);
