<script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{
  const d=frame.contentDocument,w=frame.contentWindow;if(!d||!w)return;
  const load=(id,src,next)=>{if(d.getElementById(id)){if(next)next();return}const x=d.createElement('script');x.id=id;x.src=src;x.onload=()=>next&&next();x.onerror=()=>next&&next();d.body.appendChild(x)};
  load('doctorasModule','doctoras.js?v=3',()=>load('impresionModule','impresion.js?v=4',()=>load('altaModule','alta.js?v=4',()=>load('procedimientosModule','procedimientos.js?v=1',()=>load('laboratoriosModule','laboratorios.js?v=3',()=>load('tabletFormModule','tablet-form.js?v=1',()=>load('smartMedsModule','medicacion-inteligente.js?v=4',()=>load('availableBedsModule','camas-disponibles.js?v=6',()=>load('allBedsVisualModule','vista-todas.js?v=1',()=>load('pregnantColorModule','color-embarazadas.js?v=4',()=>load('moveBedModule','cambio-cama.js?v=1',()=>load('deleteTasksModule','eliminar-pendientes.js?v=1',()=>load('patientFiltersModule','filtros-pacientes.js?v=1',()=>load('guardModule','guardia.js?v=1',()=>load('dxAcceptModule','diagnosticos-aceptar.js?v=1',()=>load('connectionSafeModule','conexion-segura.js?v=2',()=>load('familyInfoModule','informacion-familiar-v3.js?v=3',()=>load('registryExcelModule','registro-excel.js?v=5',()=>load('puerperalDischargesModule','altas-puerperios.js?v=5'))))))))))))))))))));
  const forceEval=(src)=>fetch(src+(src.includes('?')?'&':'?')+'cb='+Date.now(),{cache:'no-store'}).then(r=>r.text()).then(code=>w.eval(code)).catch(console.error);
  let tries=0;const t=setInterval(()=>{tries++;if(w.beds&&d.querySelector('.tabs')&&d.querySelector('.demo')){clearInterval(t);forceEval('color-embarazadas.js?v=4');forceEval('informacion-familiar-v3.js?v=3');forceEval('altas-puerperios.js?v=5')}else if(tries>40)clearInterval(t)},250);
});
</script>
