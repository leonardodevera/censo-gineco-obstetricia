<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1f5fbf"><title>Censo Gineco-Obstetricia</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f5f7fb;color:#172033}header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #dde3ec;padding:12px}.headrow{display:flex;align-items:center;gap:10px;margin-bottom:8px}h1{font-size:20px;margin:0;flex:1}.search{flex:0 1 390px}.search input{width:100%;border:1px solid #cbd5e1;border-radius:999px;padding:9px 13px;font-size:14px;background:#f8fafc}.sum{display:flex;gap:6px;flex-wrap:wrap}.pill{background:#eef2f7;border:1px solid #d9e0ea;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:700;cursor:pointer}.pill.active{background:#1f5fbf;color:#fff;border-color:#1f5fbf}main{padding:12px;max-width:1200px;margin:auto}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.tabs button{white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.bed{min-height:132px;border:2px solid #a8b0ba;border-radius:12px;padding:10px;text-align:left;background:#edf1f5}.bed.preg{background:#fff3cd;border-color:#e6b800}.bed.puer{background:#ffe0ec;border-color:#d94f8a}.bed.gyn{background:#dceeff;border-color:#3986c6}.top{display:flex;justify-content:space-between;gap:6px}.id{font-weight:800}.badge{font-size:10px;background:#ffffffa8;padding:3px 6px;border-radius:999px}.name{font-weight:700;margin-top:8px;font-size:13px}.dx{font-size:11px;margin-top:4px;color:#475569}.task{font-size:11px;font-weight:700;margin-top:7px}.task.pending{color:#8a5a00}.task.overdue{color:#b42318}.specials{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}.specialtag{font-size:10px;font-weight:800;padding:3px 6px;border-radius:999px;background:#fff;border:1px solid #cbd5e1}.specialtag.icu{border-color:#7c3aed;color:#6d28d9}.specialtag.iso{border-color:#dc2626;color:#b91c1c}.specialtag.watch{border-color:#ea580c;color:#c2410c}.empty{grid-column:1/-1;text-align:center;padding:30px;color:#64748b;background:#fff;border-radius:12px;border:1px dashed #cbd5e1}button,input,select,textarea{font:inherit}button{border:1px solid #cfd7e3;background:white;border-radius:9px;padding:10px;cursor:pointer}.primary{background:#1f5fbf;color:#fff;border-color:#1f5fbf}.danger{color:#b42318;background:#fff3f3}.demo{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}.secondary{background:#eef4ff;color:#174ea6;border-color:#b9cff5}#modal,#handoffModal{display:none;position:fixed;inset:0;background:#0007;z-index:30;padding:10px;overflow:auto}.panel{background:#fff;border-radius:16px;max-width:760px;margin:10px auto}.head{display:flex;justify-content:space-between;align-items:center;padding:14px;border-bottom:1px solid #e2e8f0}.body{padding:14px}.form{display:grid;gap:10px}.form label{font-size:12px;font-weight:700}.form input,.form select,.form textarea{display:block;width:100%;margin-top:4px;border:1px solid #cbd5e1;border-radius:9px;padding:10px;font-size:16px}.form textarea{min-height:68px}.specialbox{border:1px solid #dbe3ee;border-radius:10px;padding:10px;background:#f8fafc}.checks{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}.checks label{display:flex;align-items:center;gap:6px;font-size:13px}.checks input{width:auto;margin:0}.taskrow{display:grid;grid-template-columns:1fr 150px 110px;gap:6px}.taskitem{background:#f8fafc;border:1px solid #e2e8f0;border-radius:9px;padding:9px;margin-top:7px;font-size:13px}.taskline{display:flex;gap:8px;align-items:flex-start}.taskline input{width:auto;margin-top:2px}.taskcontent{flex:1}.state{font-size:10px;font-weight:800;padding:3px 6px;border-radius:999px;display:inline-block;margin-bottom:4px}.state.pending{background:#fff7d6;color:#7a4c00}.state.overdue{background:#fee2e2;color:#991b1b}.state.done{background:#dcfce7;color:#166534}.note{margin-top:6px;padding:7px;background:#fff;border-left:3px solid #b42318;border-radius:6px;font-size:12px}.mini{padding:6px 8px;font-size:11px;margin-top:7px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.handoff{white-space:pre-wrap;font-family:inherit;font-size:13px;line-height:1.45;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:12px;max-height:65vh;overflow:auto}@media(max-width:600px){.headrow{align-items:stretch;gap:7px}h1{font-size:17px;display:flex;align-items:center}.search{flex:0 0 48%;min-width:0}.search input{font-size:13px;padding:9px 11px}.search input::placeholder{font-size:12px}.taskrow{grid-template-columns:1fr 1fr}.taskrow #taskText{grid-column:1/-1}}@media(min-width:700px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.form{grid-template-columns:1fr 1fr}.full{grid-column:1/-1}}</style></head><body><header><div class="headrow"><h1>Censo Gineco-Obstetricia</h1><div class="search"><input id="search" type="search" placeholder="🔎 Buscar nombre, HC o cama"></div></div><div class="sum"><button class="pill" id="occ">0 ocupadas</button><button class="pill" id="free">60 disponibles</button><button class="pill" id="pend">0 pendientes</button></div></header><main><div class="tabs"><button data-sector="preg">🤰 Embarazadas</button><button data-sector="puer">👶 Puérperas</button><button data-sector="flex">♀ Ginecológicas / Puérperas</button></div><div class="demo"><button class="primary" id="demo">Cargar demostración</button><button id="reset">Vaciar demo</button><button class="secondary" id="handoffBtn">📋 Entrega de guardia</button></div><div id="beds" class="grid"></div></main><div id="modal"><div class="panel"><div class="head"><strong id="title">Cama</strong><button id="close">✕</button></div><div class="body"><form id="form" class="form"><label>Tipo<select id="type"><option value="">Disponible</option><option value="preg">Embarazada</option><option value="puer">Puérpera</option><option value="gyn">Ginecológica</option></select></label><label>Historia clínica<input id="hc"></label><label class="full">Nombre y apellidos<input id="name"></label><div class="full specialbox"><strong style="font-size:13px">⚠️ Condición especial</strong><div class="checks"><label><input type="checkbox" id="postICU"> Subió de UCI</label><label><input type="checkbox" id="isolation"> Aislamiento</label><label><input type="checkbox" id="closeWatch"> Vigilancia estrecha</label></div></div><label class="full">Diagnósticos<textarea id="dx"></textarea></label><label class="full">Procedimiento<textarea id="proc"></textarea></label><label class="full">Kardex<textarea id="kardex"></textarea></label><label class="full">Plan<textarea id="plan"></textarea></label><label class="full">Laboratorios<textarea id="labs" placeholder="Pega aquí los resultados"></textarea></label><div class="full"><strong>Pendientes / recordatorios</strong><div class="taskrow"><input id="taskText" placeholder="Ej. Ecografía obstétrica"><input id="taskDate" type="date"><input id="taskTime" type="time"></div><button type="button" id="addTask">Añadir pendiente</button><div id="taskList"></div></div><div class="full actions"><button class="primary" type="submit">Guardar cama</button><button class="danger" type="button" id="release">Liberar cama</button></div></form></div></div></div><div id="handoffModal"><div class="panel"><div class="head"><strong>📋 Entrega de guardia</strong><button id="handoffClose">✕</button></div><div class="body"><div id="handoffText" class="handoff"></div><div class="actions"><button class="primary" id="copyHandoff">Copiar entrega</button></div></div></div></div><script>const BED_IDS=['601','602','603-A','603-B','604-A','604-B','604-C','604-D','605-A','605-B','605-C','605-D','606-A','606-B','607-A','607-B','608-A','608-B','608-C','608-D','609-A','609-B','609-C','609-D','6010-A','6010-B','6010-C','6010-D','6011-A','6011-B','612','613','614-A','614-B','615-A','615-B','615-C','615-D','616-A','616-B','616-C','616-D','617-A','617-B','618-A','618-B','619-A','619-B','620-A','620-B','620-C','620-D','621-A','621-B','621-C','621-D','622-A','622-B','622-C','622-D'];const KEY='censo_go_v2_realbeds';let sector='preg',filter='sector',selected=null,beds;const emptySpecial=()=>({postICU:false,isolation:false,closeWatch:false});const makeBeds=()=>BED_IDS.map((id,i)=>({id,index:i,type:'',name:'',hc:'',dx:'',proc:'',kardex:'',plan:'',labs:'',special:emptySpecial(),tasks:[]}));try{beds=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}if(!Array.isArray(beds)||beds.length!==60)beds=makeBeds();beds=beds.map((b,i)=>({...makeBeds()[i],...b,index:i,id:BED_IDS[i],special:{...emptySpecial(),...(b.special||{})},tasks:Array.isArray(b.tasks)?b.tasks.map(t=>({text:t.text||'',date:t.date||'',time:t.time||'',done:!!t.done,doneAt:t.doneAt||'',note:t.note||''})):[]}));const $=id=>document.getElementById(id),ranges={preg:[0,19],puer:[20,39],flex:[40,59]},label={preg:'Embarazada',puer:'Puérpera',gyn:'Ginecológica','':'Disponible'},icon={preg:'🤰',puer:'👶',gyn:'♀','':'○'};function save(){localStorage.setItem(KEY,JSON.stringify(beds))}function defaultType(i){return i<20?'preg':i<40?'puer':''}function norm(s){return(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}function localDate(d=new Date()){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+day}function fmtDate(s){if(!s)return'';const[a,b,c]=s.split('-');return c+'/'+b+'/'+a}function taskStatus(t){if(t.done)return'done';if(t.date&&t.time){const due=new Date(t.date+'T'+t.time+':00');if(new Date()>due)return'overdue'}return'pending'}function taskWhen(t){return[t.date?fmtDate(t.date):'',t.time||''].filter(Boolean).join(' · ')}function specialLabels(b){const s=b.special||emptySpecial(),out=[];if(s.postICU)out.push('POST-UCI');if(s.isolation)out.push('AISLAMIENTO');if(s.closeWatch)out.push('VIGILANCIA ESTRECHA');return out}function earliestOpen(b){const xs=b.tasks.filter(t=>taskStatus(t)!=='done').map(t=>({s:taskStatus(t),d:(t.date||'9999-99-99')+' '+(t.time||'99:99')}));xs.sort((a,b)=>(a.s==='overdue'?0:1)-(b.s==='overdue'?0:1)||a.d.localeCompare(b.d));return xs[0]||{s:'pending',d:'9999'}}function filteredBeds(){const q=norm($('search').value.trim());if(q)return beds.filter(b=>norm(b.name).includes(q)||norm(b.hc).includes(q)||norm(b.id).includes(q));if(filter==='occupied')return beds.filter(b=>b.type);if(filter==='free')return beds.filter(b=>!b.type);if(filter==='pending')return beds.filter(b=>b.tasks.some(t=>taskStatus(t)!=='done')).sort((a,b)=>{const x=earliestOpen(a),y=earliestOpen(b);return(x.s==='overdue'?0:1)-(y.s==='overdue'?0:1)||x.d.localeCompare(y.d)});const[a,z]=ranges[sector];return beds.filter(b=>b.index>=a&&b.index<=z)}function render(){const box=$('beds');box.innerHTML='';const list=filteredBeds();if(!list.length)box.innerHTML='<div class="empty">No se encontraron pacientes o camas con esa búsqueda.</div>';list.forEach(b=>{const t=b.type||defaultType(b.index),open=b.tasks.filter(x=>taskStatus(x)!=='done'),over=open.filter(x=>taskStatus(x)==='overdue').length,pending=open.length-over,sp=specialLabels(b),btn=document.createElement('button');btn.className='bed '+(b.type||t||'');const tags=sp.length?'<div class="specials">'+sp.map(x=>'<span class="specialtag '+(x==='POST-UCI'?'icu':x==='AISLAMIENTO'?'iso':'watch')+'">⚠️ '+x+'</span>').join('')+'</div>':'';const tasks=(over?'<div class="task overdue">🔴 '+over+' vencido'+(over>1?'s':'')+'</div>':'')+(pending?'<div class="task pending">⏳ '+pending+' pendiente'+(pending>1?'s':'')+'</div>':'');btn.innerHTML='<div class="top"><span class="id">Cama '+b.id+'</span><span class="badge">'+icon[t]+' '+(b.type?label[b.type]:(b.index>=40?'Ginecológica / Puérpera':label[t]))+'</span></div><div class="name">'+(b.name||'Disponible')+'</div><div class="dx">'+(b.dx||'Toca para ingresar paciente')+'</div>'+tags+tasks;btn.onclick=()=>openBed(b.index);box.appendChild(btn)});const occ=beds.filter(b=>b.type).length,open=beds.flatMap(b=>b.tasks).filter(t=>taskStatus(t)!=='done'),over=open.filter(t=>taskStatus(t)==='overdue').length;$('occ').textContent=occ+' ocupadas';$('free').textContent=(60-occ)+' disponibles';$('pend').textContent=open.length+' pendientes'+(over?' · '+over+' vencidos':'');['occ','free','pend'].forEach(id=>$(id).classList.remove('active'));if(!$('search').value.trim()){if(filter==='occupied')$('occ').classList.add('active');if(filter==='free')$('free').classList.add('active');if(filter==='pending')$('pend').classList.add('active')}}function openBed(i){selected=i;const b=beds[i];$('title').textContent='Cama '+b.id;['type','hc','name','dx','proc','kardex','plan','labs'].forEach(k=>$(k).value=b[k]||'');$('postICU').checked=!!b.special.postICU;$('isolation').checked=!!b.special.isolation;$('closeWatch').checked=!!b.special.closeWatch;$('taskDate').value=localDate();renderTasks();$('modal').style.display='block'}function sync(){if(selected===null)return;const b=beds[selected];['type','hc','name','dx','proc','kardex','plan','labs'].forEach(k=>b[k]=$(k).value.trim());b.special={postICU:$('postICU').checked,isolation:$('isolation').checked,closeWatch:$('closeWatch').checked}}function renderTasks(){const b=beds[selected],box=$('taskList');box.innerHTML='';if(!b.tasks.length){box.innerHTML='<div style="font-size:12px;color:#64748b;margin-top:6px">Sin pendientes.</div>';return}b.tasks.forEach((t,idx)=>{const st=taskStatus(t),row=document.createElement('div');row.className='taskitem';const state=st==='done'?'✅ REALIZADO':st==='overdue'?'🔴 VENCIDO':'⏳ PENDIENTE';row.innerHTML='<div class="taskline"><input type="checkbox" '+(t.done?'checked ':'')+(st==='overdue'?'disabled ':' )+'data-task="'+idx+'"><div class="taskcontent"><span class="state '+st+'">'+state+'</span><div><strong>'+t.text+'</strong>'+(taskWhen(t)?' · '+taskWhen(t):'')+'</div>'+(t.doneAt?'<div style="font-size:11px;color:#64748b;margin-top:3px">Marcado realizado: '+new Date(t.doneAt).toLocaleString('es-EC')+'</div>':'')+(t.note?'<div class="note">📝 '+t.note+'</div>':'')+(st==='overdue'?'<button type="button" class="mini" data-note="'+idx+'">Agregar nota aclaratoria</button>':'')+'</div></div>';box.appendChild(row)});box.querySelectorAll('[data-task]').forEach(cb=>cb.onchange=()=>{const t=b.tasks[+cb.dataset.task];t.done=cb.checked;t.doneAt=cb.checked?new Date().toISOString():'';save();renderTasks();render()});box.querySelectorAll('[data-note]').forEach(btn=>btn.onclick=()=>{const t=b.tasks[+btn.dataset.note],txt=prompt('Nota aclaratoria del pendiente vencido:',t.note||'');if(txt===null)return;t.note=txt.trim();save();renderTasks();render()})}function buildHandoff(){const occupied=beds.filter(b=>b.type);if(!occupied.length)return'Sin pacientes ocupando camas.';return occupied.map(b=>{const lines=['Cama '+b.id+' — '+label[b.type],b.name+(b.hc?' · HC '+b.hc:'')];const sp=specialLabels(b);if(sp.length)lines.push('⚠️ '+sp.join(' · '));if(b.dx)lines.push('Dx: '+b.dx);if(b.proc)lines.push('Procedimiento: '+b.proc);const ts=b.tasks.slice().sort((a,b)=>{const sa=taskStatus(a),sb=taskStatus(b),rank={overdue:0,pending:1,done:2};return rank[sa]-rank[sb]||((a.date||'')+(a.time||'')).localeCompare((b.date||'')+(b.time||''))});ts.forEach(t=>{const st=taskStatus(t),pre=st==='done'?'✅':st==='overdue'?'🔴':'⏳',status=st==='done'?'Realizado':st==='overdue'?'Vencido':'Pendiente';lines.push(pre+' '+status+': '+t.text+(taskWhen(t)?' — '+taskWhen(t):'')+(t.note?' | Nota: '+t.note:''))});return lines.join('\n')}).join('\n\n')}document.querySelectorAll('[data-sector]').forEach(b=>b.onclick=()=>{sector=b.dataset.sector;filter='sector';$('search').value='';render()});$('search').oninput=render;$('occ').onclick=()=>{$('search').value='';filter=filter==='occupied'?'sector':'occupied';render()};$('free').onclick=()=>{$('search').value='';filter=filter==='free'?'sector':'free';render()};$('pend').onclick=()=>{$('search').value='';filter=filter==='pending'?'sector':'pending';render()};$('close').onclick=()=>{$('modal').style.display='none'};$('form').onsubmit=e=>{e.preventDefault();sync();save();render();$('modal').style.display='none'};$('addTask').onclick=()=>{const text=$('taskText').value.trim();if(!text||selected===null)return;sync();beds[selected].tasks.push({text,date:$('taskDate').value,time:$('taskTime').value,done:false,doneAt:'',note:''});$('taskText').value='';$('taskTime').value='';save();renderTasks();render()};$('release').onclick=()=>{if(selected===null||!confirm('¿Liberar cama y borrar los datos de esta paciente?'))return;const id=beds[selected].id;beds[selected]={...makeBeds()[selected],id,index:selected};save();render();$('modal').style.display='none'};$('handoffBtn').onclick=()=>{$('handoffText').textContent=buildHandoff();$('handoffModal').style.display='block'};$('handoffClose').onclick=()=>{$('handoffModal').style.display='none'};$('copyHandoff').onclick=async()=>{try{await navigator.clipboard.writeText($('handoffText').textContent);$('copyHandoff').textContent='✅ Copiado';setTimeout(()=>$('copyHandoff').textContent='Copiar entrega',1400)}catch(e){alert('No se pudo copiar automáticamente. Mantén presionado el texto para copiarlo.')}};$('demo').onclick=()=>{const d=new Date(),y=new Date(d);y.setDate(d.getDate()-1);const tm=new Date(d);tm.setDate(d.getDate()+1);const Y=localDate(y),T=localDate(d),M=localDate(tm);beds=makeBeds();beds[0]={...beds[0],type:'preg',name:'María P. (demo)',hc:'001234',dx:'Amenaza de parto pretérmino',plan:'Vigilancia materno-fetal',labs:'Hb 11.2 / Plaq 218000',special:{postICU:false,isolation:false,closeWatch:true},tasks:[{text:'Ecografía obstétrica',date:M,time:'09:00',done:false,doneAt:'',note:''},{text:'NST',date:T,time:'08:00',done:true,doneAt:new Date().toISOString(),note:''}]};beds[3]={...beds[3],type:'preg',name:'Daniela R. (demo)',hc:'001589',dx:'Preeclampsia con signos de severidad',special:{postICU:true,isolation:false,closeWatch:true},tasks:[{text:'Control de laboratorio',date:Y,time:'16:00',done:false,doneAt:'',note:'Se tomó muestra a las 17:10; resultado cargado posteriormente.'},{text:'Valoración por Medicina Crítica',date:M,time:'10:30',done:false,doneAt:'',note:''}]};beds[7]={...beds[7],type:'preg',name:'Sofía L. (demo)',hc:'002041',dx:'RPM pretérmino',special:{postICU:false,isolation:true,closeWatch:false},tasks:[{text:'Ecografía de crecimiento fetal',date:Y,time:'14:00',done:false,doneAt:'',note:''}]};beds[21]={...beds[21],type:'puer',name:'Ana C. (demo)',hc:'004321',dx:'Puerperio quirúrgico',proc:'Cesárea segmentaria',plan:'Control Hb y deambulación',labs:'Hb 9.8 / Hto 30',special:emptySpecial(),tasks:[{text:'Retiro de sonda Foley',date:T,time:'07:30',done:true,doneAt:new Date().toISOString(),note:''},{text:'Valorar alta',date:M,time:'08:00',done:false,doneAt:'',note:''}]};beds[24]={...beds[24],type:'puer',name:'Carolina V. (demo)',hc:'005610',dx:'Puerperio inmediato posterior a hemorragia posparto',special:{postICU:true,isolation:false,closeWatch:true},tasks:[{text:'Control de hemoglobina',date:Y,time:'18:00',done:false,doneAt:'',note:'Se realizó a las 18:40, no se registró oportunamente en el censo.'},{text:'Control de signos vitales',date:T,time:'10:00',done:true,doneAt:new Date().toISOString(),note:''}]};beds[31]={...beds[31],type:'puer',name:'Valeria M. (demo)',hc:'006033',dx:'Puerperio vaginal',special:{postICU:false,isolation:true,closeWatch:false},tasks:[{text:'Resultado de urocultivo',date:M,time:'12:00',done:false,doneAt:'',note:''}]};beds[44]={...beds[44],type:'gyn',name:'Paciente G. (demo)',hc:'009876',dx:'Miomatosis uterina',proc:'Histerectomía',plan:'Control postoperatorio',special:{postICU:false,isolation:false,closeWatch:false},tasks:[{text:'Revaloración médica',date:T,time:'06:00',done:true,doneAt:new Date().toISOString(),note:''}]};beds[48]={...beds[48],type:'gyn',name:'Elena T. (demo)',hc:'008720',dx:'Postoperatorio de laparotomía exploratoria',special:{postICU:true,isolation:false,closeWatch:false},tasks:[{text:'Curación de herida',date:Y,time:'11:00',done:false,doneAt:'',note:''},{text:'Control de biometría hemática',date:M,time:'07:00',done:false,doneAt:'',note:''}]};beds[55]={...beds[55],type:'gyn',name:'Lucía B. (demo)',hc:'007441',dx:'Absceso pélvico en tratamiento',special:{postICU:false,isolation:true,closeWatch:true},tasks:[{text:'Interconsulta Infectología',date:M,time:'09:30',done:false,doneAt:'',note:''},{text:'Control de PCR',date:T,time:'07:00',done:true,doneAt:new Date().toISOString(),note:''}]};save();render()};$('reset').onclick=()=>{if(!confirm('¿Vaciar las 60 camas de la demo?'))return;beds=makeBeds();save();render()};render();setInterval(render,60000);</script></body></html>
